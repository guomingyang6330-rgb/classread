<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#143d31">
  <title>课阅 ClassRead · 英语机构作业批改原型</title>
  <style>:root {
  --bg: #f4f1e9;
  --bg-deep: #ece8dd;
  --surface: #ffffff;
  --surface-soft: rgba(255, 255, 255, 0.72);
  --ink: #1d2b27;
  --ink-soft: #34443e;
  --muted: #77837c;
  --muted-2: #9aa39e;
  --line: #e6e1d6;
  --line-strong: #d7d0c2;
  --green: #245743;
  --green-2: #2f6b55;
  --green-3: #4a8a6f;
  --mint: #dcece3;
  --mint-2: #edf5f0;
  --gold: #d6a04a;
  --gold-soft: #f6ead3;
  --coral: #cb6a55;
  --coral-soft: #f8e3dc;
  --blue: #5c769f;
  --blue-soft: #e7ecf5;
  --violet: #7d6c9b;
  --violet-soft: #efeaf5;
  --danger: #b64e42;
  --shadow-sm: 0 2px 8px rgba(31, 45, 38, 0.04);
  --shadow: 0 14px 34px rgba(31, 45, 38, 0.07);
  --shadow-lg: 0 26px 70px rgba(25, 42, 34, 0.13);
  --radius-sm: 12px;
  --radius: 18px;
  --radius-lg: 24px;
  --radius-xl: 32px;
  --sidebar-w: 234px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --serif: "Iowan Old Style", "Songti SC", "Noto Serif SC", Georgia, serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-width: 320px;
  color: var(--ink);
  background: var(--bg);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body.modal-open { overflow: hidden; }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
svg { display: block; }
::selection { background: var(--mint); color: var(--green); }

.icon { width: 18px; height: 18px; flex: 0 0 auto; }
.icon.sm { width: 15px; height: 15px; }
.icon.lg { width: 22px; height: 22px; }
.icon.xl { width: 28px; height: 28px; }

/* ---------- App shell ---------- */
.app-shell { min-height: 100vh; }
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 40;
  width: var(--sidebar-w);
  display: flex;
  flex-direction: column;
  padding: 24px 14px 18px;
  color: #fff;
  background:
    radial-gradient(circle at 18% 4%, rgba(214, 160, 74, 0.16), transparent 30%),
    radial-gradient(circle at 88% 78%, rgba(90, 150, 120, 0.16), transparent 36%),
    linear-gradient(180deg, #123b2f 0%, #0d2a22 100%);
}
.sidebar::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.12;
  background-image: radial-gradient(rgba(255,255,255,0.35) 0.7px, transparent 0.7px);
  background-size: 18px 18px;
  mask-image: linear-gradient(to bottom, black, transparent 65%);
}
.brand { position: relative; z-index: 1; display: flex; align-items: center; gap: 11px; padding: 0 10px 26px; }
.brand-mark {
  display: grid; place-items: center;
  width: 42px; height: 42px;
  color: #163b2e;
  border-radius: 14px;
  background: linear-gradient(145deg, #f0c679, #d3963c);
  box-shadow: 0 8px 20px rgba(214, 160, 74, 0.22);
}
.brand-name { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
.brand-en { margin-top: 1px; font-size: 8px; font-weight: 700; letter-spacing: 0.24em; color: rgba(255,255,255,0.42); }
.nav-group { position: relative; z-index: 1; display: grid; gap: 5px; margin-top: 10px; }
.nav-label { padding: 8px 14px 5px; font-size: 9px; font-weight: 700; letter-spacing: 0.18em; color: rgba(255,255,255,0.32); }
.nav-link {
  display: flex; align-items: center; gap: 11px;
  min-height: 42px; padding: 10px 13px;
  border-radius: 12px;
  font-size: 13px; font-weight: 600;
  color: rgba(255,255,255,0.64);
  transition: 0.18s ease;
}
.nav-link:hover { color: #fff; background: rgba(255,255,255,0.07); }
.nav-link.active { color: var(--ink); background: #f7f5ee; box-shadow: 0 7px 18px rgba(0,0,0,0.12); }
.nav-link.active .icon { color: var(--green); }
.nav-badge {
  display: inline-grid; place-items: center;
  min-width: 19px; height: 19px; margin-left: auto; padding: 0 5px;
  border-radius: 9px; background: var(--coral); color: #fff;
  font-size: 9px; font-weight: 800;
}
.sidebar-spacer { flex: 1; }
.sidebar-profile {
  position: relative; z-index: 1;
  display: flex; align-items: center; gap: 10px;
  margin: 16px 5px 0; padding: 12px;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  background: rgba(255,255,255,0.055);
}
.sidebar-profile .avatar { background: rgba(255,255,255,0.14); color: #fff; }
.sidebar-profile-name { font-size: 12px; font-weight: 700; }
.sidebar-profile-sub { margin-top: 2px; font-size: 9px; color: rgba(255,255,255,0.45); }
.sidebar-profile .icon-btn { margin-left: auto; color: rgba(255,255,255,0.55); }

.main { min-height: 100vh; margin-left: var(--sidebar-w); }
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between;
  height: 72px; padding: 0 34px;
  border-bottom: 1px solid rgba(215, 208, 194, 0.55);
  background: rgba(244, 241, 233, 0.83);
  backdrop-filter: blur(18px);
}
.topbar-crumb { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 650; color: var(--muted); }
.topbar-crumb strong { color: var(--ink); font-weight: 750; }
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.prototype-pill {
  display: inline-flex; align-items: center; gap: 7px;
  height: 30px; padding: 0 11px;
  border: 1px solid var(--line); border-radius: 999px;
  background: rgba(255,255,255,0.7);
  color: var(--muted); font-size: 10px; font-weight: 700;
}
.prototype-pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 4px rgba(214,160,74,0.12); }
.icon-btn {
  display: inline-grid; place-items: center;
  width: 34px; height: 34px;
  border: 1px solid var(--line); border-radius: 11px;
  background: rgba(255,255,255,0.65); color: var(--ink-soft);
  transition: 0.18s ease;
}
.icon-btn:hover { border-color: var(--line-strong); background: #fff; transform: translateY(-1px); }
.icon-btn.dark { color: #fff; border-color: rgba(255,255,255,0.1); background: rgba(255,255,255,0.06); }
.icon-btn.plain { border-color: transparent; background: transparent; }
.user-chip { display: flex; align-items: center; gap: 9px; padding: 4px 5px 4px 4px; border-radius: 12px; border: 1px solid transparent; background: transparent; }
.user-chip:hover { border-color: var(--line); background: rgba(255,255,255,0.6); }
.user-chip-name { font-size: 11px; font-weight: 750; line-height: 1.2; text-align: left; }
.user-chip-role { margin-top: 2px; font-size: 9px; color: var(--muted); text-align: left; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 0 3px var(--coral-soft); }

.page { width: min(1320px, 100%); margin: 0 auto; padding: 30px 34px 64px; }
.page.narrow { width: min(1120px, 100%); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 22px; margin-bottom: 24px; }
.page-head h1 { margin: 4px 0 0; font-size: clamp(26px, 2.6vw, 36px); line-height: 1.15; letter-spacing: -0.035em; font-weight: 800; }
.page-head p { margin: 9px 0 0; font-size: 12px; line-height: 1.6; color: var(--muted); }
.eyebrow { font-size: 9px; font-weight: 800; letter-spacing: 0.18em; color: var(--muted); text-transform: uppercase; }
.page-actions { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; justify-content: flex-end; }

/* ---------- Basics ---------- */
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.split-main { display: grid; grid-template-columns: minmax(0, 1.32fr) minmax(300px, 0.88fr); gap: 16px; align-items: start; }
.stack { display: grid; gap: 16px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.tiny { font-size: 10px; }
.small { font-size: 12px; }
.strong { font-weight: 750; }
.mono { font-variant-numeric: tabular-nums; }
.mt-4 { margin-top: 4px; } .mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; } .mt-24 { margin-top: 24px; }
.mb-0 { margin-bottom: 0; } .mb-8 { margin-bottom: 8px; } .mb-12 { margin-bottom: 12px; } .mb-16 { margin-bottom: 16px; } .mb-24 { margin-bottom: 24px; }
.divider { height: 1px; background: var(--line); }
.text-green { color: var(--green); } .text-coral { color: var(--coral); } .text-gold { color: var(--gold); } .text-blue { color: var(--blue); }

.card {
  position: relative;
  min-width: 0;
  border: 1px solid rgba(213, 206, 191, 0.7);
  border-radius: var(--radius-lg);
  background: rgba(255,255,255,0.86);
  box-shadow: var(--shadow-sm);
}
.card.pad { padding: 22px; }
.card.pad-sm { padding: 16px; }
.card.pad-lg { padding: 28px; }
.card.flat { box-shadow: none; }
.card.dark { color: #fff; border-color: transparent; background: linear-gradient(140deg, #1d4d3c, #12352a); }
.card.gold { background: linear-gradient(145deg, #fbf3e3, #fffaf1); border-color: #efe0c4; }
.card.mint { background: linear-gradient(145deg, #eef7f1, #f9fbf8); border-color: #dcebe1; }
.card.blue { background: linear-gradient(145deg, #edf1f8, #f9fafc); border-color: #dfe5f0; }
.card.coral { background: linear-gradient(145deg, #fbefeb, #fffaf8); border-color: #f0dcd5; }
.card.hover { transition: 0.2s ease; }
.card.hover:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: rgba(36,87,67,0.2); }
.card-link { display: block; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 13px; }
.section-head h2 { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
.section-head p { margin: 4px 0 0; font-size: 10px; color: var(--muted); }
.section-head .link { font-size: 10px; font-weight: 750; color: var(--green-2); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 38px; padding: 9px 15px;
  border: 1px solid transparent; border-radius: 12px;
  font-size: 11px; font-weight: 750; white-space: nowrap;
  transition: 0.18s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn.primary { color: #fff; background: var(--green); box-shadow: 0 8px 18px rgba(36,87,67,0.17); }
.btn.primary:hover { background: #1d4a39; }
.btn.gold { color: #2e2414; background: linear-gradient(145deg, #eac077, #d7a04b); box-shadow: 0 8px 18px rgba(214,160,74,0.2); }
.btn.coral { color: #fff; background: var(--coral); }
.btn.dark { color: #fff; background: var(--ink); }
.btn.ghost { color: var(--ink-soft); border-color: var(--line); background: rgba(255,255,255,0.66); }
.btn.ghost:hover { border-color: var(--line-strong); background: #fff; }
.btn.soft { color: var(--green); background: var(--mint-2); border-color: #d9e9df; }
.btn.danger { color: var(--danger); border-color: #efd9d4; background: #fcf1ee; }
.btn.sm { min-height: 31px; padding: 6px 11px; border-radius: 9px; font-size: 10px; }
.btn.lg { min-height: 46px; padding: 12px 20px; border-radius: 14px; font-size: 13px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.link-btn { padding: 0; border: 0; background: none; color: var(--green-2); font-size: 10px; font-weight: 750; }
.link-btn:hover { text-decoration: underline; }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  height: 23px; padding: 0 9px;
  border-radius: 999px;
  font-size: 9px; font-weight: 750; white-space: nowrap;
}
.chip.green { color: var(--green); background: var(--mint); }
.chip.gold { color: #7b5718; background: var(--gold-soft); }
.chip.coral { color: #9f4937; background: var(--coral-soft); }
.chip.blue { color: #435f8b; background: var(--blue-soft); }
.chip.violet { color: #61527d; background: var(--violet-soft); }
.chip.gray { color: var(--muted); background: #eeebe3; }
.chip.outline { color: var(--muted); background: transparent; border: 1px solid var(--line); }
.chip.mint { color: var(--green); background: var(--mint); }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.avatar {
  display: inline-grid; place-items: center; flex: 0 0 auto;
  width: 36px; height: 36px;
  border-radius: 12px;
  color: #fff; background: var(--green-2);
  font-size: 12px; font-weight: 800;
  letter-spacing: -0.03em;
}
.avatar.sm { width: 28px; height: 28px; border-radius: 9px; font-size: 10px; }
.avatar.lg { width: 52px; height: 52px; border-radius: 16px; font-size: 17px; }
.avatar.xl { width: 72px; height: 72px; border-radius: 22px; font-size: 24px; }
.avatar.ring { box-shadow: 0 0 0 3px #fff, 0 0 0 4px var(--line); }
.avatar.soft { color: var(--green); background: var(--mint); }

.progress { height: 6px; overflow: hidden; border-radius: 999px; background: #e9e5da; }
.progress > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--green-3), var(--green)); }
.progress.gold > span { background: linear-gradient(90deg, #e9c17f, var(--gold)); }
.progress.coral > span { background: linear-gradient(90deg, #df9a87, var(--coral)); }
.progress.thin { height: 4px; }
.ring {
  display: grid; place-items: center;
  width: 72px; height: 72px;
  border-radius: 50%;
  background: conic-gradient(var(--green) calc(var(--p) * 1%), #e8e4d9 0);
  position: relative;
}
.ring::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: #fff; }
.ring > span { position: relative; z-index: 1; font-size: 14px; font-weight: 800; }
.ring.gold { background: conic-gradient(var(--gold) calc(var(--p) * 1%), #eee9dc 0); }
.ring.coral { background: conic-gradient(var(--coral) calc(var(--p) * 1%), #f0e6e1 0); }

.stat-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat-card { padding: 18px 18px 16px; border: 1px solid rgba(213,206,191,0.65); border-radius: var(--radius); background: rgba(255,255,255,0.72); }
.stat-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.stat-label { font-size: 10px; font-weight: 650; color: var(--muted); }
.stat-value { margin-top: 9px; font-size: 29px; line-height: 1; font-weight: 800; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.stat-value em { margin-left: 3px; font-size: 10px; font-style: normal; font-weight: 650; color: var(--muted); letter-spacing: 0; }
.stat-foot { margin-top: 10px; font-size: 9px; color: var(--muted); }
.stat-icon { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 10px; }
.stat-icon.green { color: var(--green); background: var(--mint); }
.stat-icon.gold { color: #8a641f; background: var(--gold-soft); }
.stat-icon.coral { color: #9f4937; background: var(--coral-soft); }
.stat-icon.blue { color: #435f8b; background: var(--blue-soft); }

/* ---------- Login ---------- */
.login-page { min-height: 100vh; display: grid; grid-template-columns: minmax(480px, 1.08fr) minmax(500px, 0.92fr); background: var(--bg); }
.login-hero {
  position: relative; overflow: hidden;
  display: flex; flex-direction: column; justify-content: space-between;
  min-height: 100vh; padding: 46px 56px;
  color: #fff;
  background:
    radial-gradient(circle at 75% 18%, rgba(214,160,74,0.24), transparent 28%),
    radial-gradient(circle at 16% 78%, rgba(111,175,140,0.22), transparent 34%),
    linear-gradient(148deg, #194534 0%, #0f2f26 58%, #0a241d 100%);
}
.login-hero::before {
  content: ""; position: absolute; width: 560px; height: 560px; right: -180px; top: 18%; border: 1px solid rgba(255,255,255,0.1); border-radius: 50%;
  box-shadow: 0 0 0 70px rgba(255,255,255,0.025), 0 0 0 140px rgba(255,255,255,0.018);
}
.login-hero::after {
  content: ""; position: absolute; inset: 0; opacity: 0.15; pointer-events: none;
  background-image: radial-gradient(rgba(255,255,255,0.5) 0.7px, transparent 0.7px);
  background-size: 24px 24px;
  mask-image: linear-gradient(135deg, black, transparent 60%);
}
.login-brand { position: relative; z-index: 1; display: flex; align-items: center; gap: 13px; }
.login-brand .brand-mark { width: 48px; height: 48px; border-radius: 16px; }
.login-brand-name { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; }
.login-brand-sub { margin-top: 2px; font-size: 9px; font-weight: 700; letter-spacing: 0.28em; color: rgba(255,255,255,0.42); }
.login-hero-copy { position: relative; z-index: 1; max-width: 560px; padding: 60px 0; }
.login-kicker { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 22px; padding: 7px 12px; border: 1px solid rgba(255,255,255,0.14); border-radius: 999px; font-size: 9px; font-weight: 750; letter-spacing: 0.14em; color: rgba(255,255,255,0.65); background: rgba(255,255,255,0.045); }
.login-kicker i { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
.login-hero h1 { margin: 0; max-width: 540px; font-size: clamp(42px, 4.7vw, 68px); line-height: 1.08; font-weight: 800; letter-spacing: -0.055em; }
.login-hero h1 span { color: #e9c27d; }
.login-hero p { max-width: 470px; margin: 24px 0 0; font-size: 14px; line-height: 1.85; color: rgba(255,255,255,0.56); }
.login-flow { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 34px; }
.login-flow span { display: inline-flex; align-items: center; gap: 7px; padding: 8px 11px; border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; color: rgba(255,255,255,0.62); font-size: 10px; font-weight: 650; background: rgba(255,255,255,0.045); }
.login-flow b { color: #e9c27d; font-weight: 800; }
.login-hero-foot { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 18px; font-size: 9px; color: rgba(255,255,255,0.34); }
.login-hero-foot .dots { display: flex; gap: 5px; }
.login-hero-foot .dots i { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.3); }
.login-hero-foot .dots i:first-child { background: var(--gold); }

.login-panel { display: flex; flex-direction: column; justify-content: center; min-height: 100vh; padding: 52px clamp(34px, 6vw, 86px); background: #f8f5ee; }
.login-panel-head { max-width: 480px; }
.login-panel-head h2 { margin: 6px 0 0; font-size: 30px; letter-spacing: -0.04em; font-weight: 800; }
.login-panel-head p { margin: 10px 0 0; font-size: 12px; line-height: 1.7; color: var(--muted); }
.role-grid { display: grid; gap: 12px; max-width: 480px; margin-top: 26px; }
.role-card {
  display: flex; align-items: center; gap: 14px; width: 100%;
  padding: 15px 15px 15px 16px;
  text-align: left;
  border: 1px solid var(--line); border-radius: 18px;
  background: rgba(255,255,255,0.72);
  transition: 0.2s ease;
}
.role-card:hover { transform: translateY(-2px); border-color: rgba(36,87,67,0.26); background: #fff; box-shadow: var(--shadow); }
.role-icon { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 14px; }
.role-icon.green { color: var(--green); background: var(--mint); }
.role-icon.gold { color: #865f1c; background: var(--gold-soft); }
.role-icon.coral { color: #9d4b39; background: var(--coral-soft); }
.role-card-name { font-size: 13px; font-weight: 800; }
.role-card-sub { margin-top: 3px; font-size: 10px; color: var(--muted); }
.role-card .arrow { margin-left: auto; color: var(--muted-2); transition: 0.2s ease; }
.role-card:hover .arrow { transform: translateX(3px); color: var(--green); }
.login-note { max-width: 480px; margin-top: 18px; padding: 13px 15px; border: 1px dashed var(--line-strong); border-radius: 14px; font-size: 10px; line-height: 1.65; color: var(--muted); background: rgba(255,255,255,0.4); }
.login-footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; max-width: 480px; margin-top: 30px; font-size: 9px; color: var(--muted-2); }

/* ---------- Tables / lists ---------- */
.table-wrap { overflow: auto; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.6); }
.data-table { width: 100%; min-width: 700px; border-collapse: collapse; }
.data-table th { padding: 12px 15px; text-align: left; font-size: 9px; font-weight: 800; letter-spacing: 0.09em; color: var(--muted-2); background: rgba(244,241,233,0.68); white-space: nowrap; }
.data-table td { padding: 13px 15px; border-top: 1px solid var(--line); font-size: 11px; vertical-align: middle; }
.data-table tbody tr { transition: 0.16s ease; }
.data-table tbody tr:hover { background: rgba(255,255,255,0.75); }
.data-table tbody tr:first-child td { border-top: 0; }
.person-cell { display: flex; align-items: center; gap: 10px; min-width: 148px; }
.person-cell .name { font-size: 11px; font-weight: 750; }
.person-cell .sub { margin-top: 2px; font-size: 9px; color: var(--muted); }
.cell-actions { display: flex; align-items: center; gap: 5px; justify-content: flex-end; }
.cell-actions .icon-btn { width: 28px; height: 28px; border-radius: 8px; }

.class-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.class-card { padding: 20px; border: 1px solid var(--line); border-radius: 20px; background: rgba(255,255,255,0.78); transition: 0.2s ease; }
.class-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.class-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.class-name { font-size: 17px; font-weight: 800; letter-spacing: -0.03em; }
.class-meta { margin-top: 4px; font-size: 10px; color: var(--muted); }
.class-teacher { display: flex; align-items: center; gap: 8px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.class-teacher .name { font-size: 10px; font-weight: 700; }
.class-teacher .sub { font-size: 9px; color: var(--muted); }
.class-stats { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 13px; font-size: 9px; color: var(--muted); }

.library-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.content-card { overflow: hidden; border: 1px solid var(--line); border-radius: 20px; background: rgba(255,255,255,0.8); transition: 0.2s ease; }
.content-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.content-cover { position: relative; display: flex; align-items: flex-end; min-height: 126px; padding: 16px; color: #fff; }
.content-cover.green { background: linear-gradient(145deg, #2d6e55, #194535); }
.content-cover.gold { background: linear-gradient(145deg, #c49343, #8a6124); }
.content-cover.blue { background: linear-gradient(145deg, #647ea8, #3e587e); }
.content-cover.coral { background: linear-gradient(145deg, #ce7a61, #9b4a37); }
.content-cover::after { content: ""; position: absolute; width: 150px; height: 150px; right: -50px; top: -70px; border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; box-shadow: 0 0 0 24px rgba(255,255,255,0.05); }
.content-cover .type { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 5px; padding: 5px 8px; border: 1px solid rgba(255,255,255,0.22); border-radius: 7px; font-size: 8px; font-weight: 750; background: rgba(255,255,255,0.1); }
.content-cover .count { position: relative; z-index: 1; margin-left: auto; font-size: 9px; color: rgba(255,255,255,0.58); }
.content-body { padding: 16px; }
.content-title { font-size: 13px; font-weight: 800; line-height: 1.4; }
.content-sub { margin-top: 5px; font-size: 9px; color: var(--muted); }
.content-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 15px; padding-top: 12px; border-top: 1px solid var(--line); }
.content-tags { display: flex; gap: 5px; flex-wrap: wrap; }

/* ---------- Teacher dashboard ---------- */
.teacher-hero {
  position: relative; overflow: hidden;
  display: flex; align-items: stretch; gap: 28px;
  padding: 28px 30px;
  color: #fff;
  border-radius: 26px;
  background:
    radial-gradient(circle at 88% 24%, rgba(214,160,74,0.22), transparent 28%),
    linear-gradient(135deg, #194a38, #0f2e24);
  box-shadow: 0 20px 46px rgba(20,61,49,0.18);
}
.teacher-hero::after { content: ""; position: absolute; width: 310px; height: 310px; right: -70px; bottom: -190px; border: 1px solid rgba(255,255,255,0.12); border-radius: 50%; box-shadow: 0 0 0 38px rgba(255,255,255,0.025); }
.teacher-hero-copy { position: relative; z-index: 1; flex: 1; min-width: 0; }
.teacher-hero h2 { margin: 5px 0 0; font-size: clamp(24px, 2.7vw, 35px); line-height: 1.2; font-weight: 800; letter-spacing: -0.04em; }
.teacher-hero p { margin: 10px 0 0; font-size: 12px; line-height: 1.7; color: rgba(255,255,255,0.55); }
.teacher-hero-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; }
.teacher-hero-side { position: relative; z-index: 1; display: flex; align-items: center; gap: 18px; padding-left: 26px; border-left: 1px solid rgba(255,255,255,0.1); }
.hero-stat { min-width: 72px; }
.hero-stat strong { display: block; font-size: 28px; line-height: 1; font-weight: 800; letter-spacing: -0.04em; }
.hero-stat span { display: block; margin-top: 6px; font-size: 9px; color: rgba(255,255,255,0.45); }

.quick-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
.quick-action { display: flex; align-items: center; gap: 10px; padding: 12px; text-align: left; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,0.7); transition: 0.18s ease; }
.quick-action:hover { background: #fff; border-color: var(--line-strong); transform: translateY(-1px); }
.quick-action .stat-icon { width: 34px; height: 34px; }
.quick-action strong { display: block; font-size: 10px; font-weight: 750; }
.quick-action span { display: block; margin-top: 2px; font-size: 8px; color: var(--muted); }

.queue-list { display: grid; gap: 8px; }
.queue-item { display: flex; align-items: center; gap: 11px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,0.66); transition: 0.16s ease; }
.queue-item:hover { border-color: rgba(36,87,67,0.22); background: #fff; }
.queue-item .grow { min-width: 0; }
.queue-item .q-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; font-weight: 750; }
.queue-item .q-sub { margin-top: 2px; font-size: 8px; color: var(--muted); }
.confidence { display: flex; align-items: center; gap: 6px; font-size: 8px; color: var(--muted); white-space: nowrap; }
.confidence-bar { width: 40px; height: 4px; overflow: hidden; border-radius: 999px; background: #ebe7dd; }
.confidence-bar span { display: block; height: 100%; border-radius: inherit; background: var(--green-3); }
.confidence-bar.low span { background: var(--coral); }

.class-strip { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.class-strip:last-child { border-bottom: 0; }
.class-strip .grow { min-width: 0; }
.class-strip .name { font-size: 11px; font-weight: 750; }
.class-strip .sub { margin-top: 2px; font-size: 8px; color: var(--muted); }
.class-strip .progress { width: 72px; }

.schedule-row { display: flex; align-items: center; gap: 13px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.schedule-row:last-child { border-bottom: 0; }
.schedule-time { width: 52px; font-size: 10px; font-weight: 800; color: var(--green); }
.schedule-line { width: 3px; height: 28px; border-radius: 2px; background: var(--gold); }
.schedule-line.green { background: var(--green-3); }
.schedule-title { font-size: 10px; font-weight: 750; }
.schedule-sub { margin-top: 2px; font-size: 8px; color: var(--muted); }

/* ---------- Assignments / grading queue ---------- */
.filter-bar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
.filter-tabs { display: flex; gap: 5px; padding: 4px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,0.55); }
.filter-tab { padding: 7px 11px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 10px; font-weight: 750; }
.filter-tab.active { color: var(--ink); background: #fff; box-shadow: 0 2px 7px rgba(31,45,38,0.07); }
.search-box { display: flex; align-items: center; gap: 8px; min-width: 210px; height: 34px; padding: 0 11px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,0.65); color: var(--muted); }
.search-box input { width: 100%; border: 0; outline: 0; background: transparent; font-size: 10px; color: var(--ink); }
.search-box input::placeholder { color: var(--muted-2); }

.grading-list { display: grid; gap: 8px; }
.grading-row { display: flex; align-items: center; gap: 13px; padding: 14px 15px; border: 1px solid var(--line); border-radius: 15px; background: rgba(255,255,255,0.72); transition: 0.16s ease; }
.grading-row:hover { border-color: rgba(36,87,67,0.22); background: #fff; }
.grading-row .grow { min-width: 0; }
.grading-row .title { font-size: 11px; font-weight: 750; }
.grading-row .sub { margin-top: 3px; font-size: 9px; color: var(--muted); }
.grading-score { display: flex; align-items: center; gap: 7px; min-width: 68px; }
.grading-score strong { font-size: 16px; font-weight: 800; letter-spacing: -0.03em; }
.grading-score span { font-size: 8px; color: var(--muted); }
.low-flag { display: inline-flex; align-items: center; gap: 4px; color: var(--coral); font-size: 8px; font-weight: 750; }

/* ---------- Template studio ---------- */
.studio-layout { display: grid; grid-template-columns: 224px minmax(380px, 1fr) 280px; gap: 16px; align-items: start; }
.template-list { display: grid; gap: 7px; }
.template-item { padding: 12px; border: 1px solid var(--line); border-radius: 13px; background: rgba(255,255,255,0.6); text-align: left; transition: 0.16s ease; }
.template-item:hover { background: #fff; border-color: var(--line-strong); }
.template-item.active { border-color: var(--green); background: var(--mint-2); box-shadow: 0 0 0 2px rgba(36,87,67,0.06); }
.template-item .title { font-size: 10px; font-weight: 750; line-height: 1.4; }
.template-item .sub { margin-top: 3px; font-size: 8px; color: var(--muted); }
.template-item .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; font-size: 8px; color: var(--muted); }
.studio-center { min-width: 0; }
.studio-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.studio-canvas { display: flex; justify-content: center; padding: 18px; border: 1px solid var(--line); border-radius: 18px; background: #e9e5db; }
.studio-canvas .sheet-wrap { width: 100%; max-width: 440px; }
.inspector { position: sticky; top: 90px; padding: 17px; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,0.78); }
.inspector h3 { margin: 0 0 3px; font-size: 12px; font-weight: 800; }
.inspector p { margin: 0; font-size: 9px; line-height: 1.5; color: var(--muted); }
.field { display: grid; gap: 5px; margin-top: 13px; }
.field label { font-size: 9px; font-weight: 750; color: var(--muted); }
.input, .select, .textarea {
  width: 100%; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink); outline: 0;
  font-size: 10px;
}
.input, .select { height: 34px; padding: 0 10px; }
.textarea { min-height: 82px; padding: 9px 10px; resize: vertical; line-height: 1.6; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--green-3); box-shadow: 0 0 0 3px rgba(74,138,111,0.1); }

/* ---------- Worksheet ---------- */
.sheet-wrap { width: 100%; }
.worksheet-sheet {
  position: relative; overflow: hidden;
  width: 100%; aspect-ratio: 0.707;
  padding: 5.6% 6.2%;
  color: #222; background: #fff;
  border: 1px solid #d8d2c3;
  border-radius: 3px;
  box-shadow: 0 15px 36px rgba(38,47,42,0.13);
  font-family: "Helvetica Neue", Arial, sans-serif;
}
.worksheet-sheet.with-upload { background-size: cover; background-position: center; }
.worksheet-sheet.with-upload .sheet-static { display: none; }
.sheet-static { position: relative; width: 100%; height: 100%; }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding-bottom: 2.2%; border-bottom: 1px solid #ded8ca; }
.sheet-school { font-size: 7px; font-weight: 700; letter-spacing: 0.08em; color: #6e756f; }
.sheet-title { margin-top: 3px; font-size: 14px; font-weight: 800; letter-spacing: -0.03em; }
.sheet-meta { text-align: right; font-size: 6.5px; line-height: 1.7; color: #7a817b; }
.sheet-name-line { display: flex; gap: 14px; margin-top: 2.2%; font-size: 7px; color: #69716a; }
.sheet-name-line span { white-space: nowrap; }
.sheet-instruction { margin-top: 1.7%; font-size: 6.8px; color: #6d746d; }
.sheet-q {
  position: absolute;
  display: flex; align-items: flex-start; gap: 5px;
  padding: 2px 4px;
  border: 1px dashed transparent;
  border-radius: 4px;
  cursor: pointer;
  transition: 0.16s ease;
}
.sheet-q:hover { border-color: rgba(36,87,67,0.28); background: rgba(36,87,67,0.045); }
.sheet-q.active { border-color: var(--green-3); background: rgba(74,138,111,0.07); }
.sheet-q .num { flex: 0 0 auto; min-width: 11px; font-size: 8px; font-weight: 800; color: #52625a; }
.sheet-q .q-body { min-width: 0; flex: 1; }
.sheet-q .q-text { font-size: 7.5px; line-height: 1.35; color: #303833; }
.sheet-q .q-options { margin-top: 2px; font-size: 6.4px; line-height: 1.4; color: #68716b; }
.sheet-q .answer-zone { display: flex; align-items: center; min-height: 13px; margin-top: 2px; border-bottom: 1px solid #c9c4b8; }
.sheet-q .student-answer { padding: 0 3px 1px; color: #31508b; font-family: "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive; font-size: 10px; font-weight: 700; transform: rotate(-1deg); }
.sheet-q .mark { display: grid; place-items: center; width: 9px; height: 9px; margin-left: auto; border-radius: 50%; font-size: 7px; font-weight: 900; color: #fff; }
.sheet-q .mark.ok { background: #4a8a6f; }
.sheet-q .mark.no { background: #cb6a55; }
.sheet-q .mark.mid { background: #d6a04a; }
.sheet-page-no { position: absolute; right: 0; bottom: 0; font-size: 6.5px; color: #9ba19b; }
.scan-overlay { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
.scan-overlay .scan-line { position: absolute; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, rgba(74,138,111,0.9), transparent); box-shadow: 0 0 18px rgba(74,138,111,0.55); animation: scan 1.4s ease-in-out infinite; }
.scan-overlay .corner { position: absolute; width: 18px; height: 18px; border-color: var(--green-3); border-style: solid; }
.scan-overlay .corner.tl { top: 2%; left: 2%; border-width: 2px 0 0 2px; }
.scan-overlay .corner.tr { top: 2%; right: 2%; border-width: 2px 2px 0 0; }
.scan-overlay .corner.bl { bottom: 2%; left: 2%; border-width: 0 0 2px 2px; }
.scan-overlay .corner.br { bottom: 2%; right: 2%; border-width: 0 2px 2px 0; }
@keyframes scan { 0%,100% { top: 8%; opacity: 0.4; } 50% { top: 88%; opacity: 1; } }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

/* ---------- Grading detail ---------- */
.grading-grid { display: grid; grid-template-columns: minmax(330px, 0.88fr) minmax(400px, 1.12fr); gap: 20px; align-items: start; }
.paper-panel { position: sticky; top: 88px; }
.review-panel { display: grid; gap: 12px; }
.review-summary { padding: 18px; border: 1px solid var(--line); border-radius: 18px; background: rgba(255,255,255,0.82); }
.review-summary-top { display: flex; align-items: center; gap: 15px; }
.big-score { font-size: 40px; line-height: 1; font-weight: 800; letter-spacing: -0.06em; }
.big-score small { margin-left: 2px; font-size: 11px; font-weight: 650; color: var(--muted); letter-spacing: 0; }
.question-review { padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,0.78); transition: 0.16s ease; }
.question-review.is-correct { border-color: #cfe4d8; background: #f6fbf8; }
.question-review.is-wrong { border-color: #f0d4cc; background: #fdf7f5; }
.question-review-head { display: flex; align-items: flex-start; gap: 9px; }
.q-no { display: grid; place-items: center; flex: 0 0 auto; width: 23px; height: 23px; border-radius: 7px; color: var(--green); background: var(--mint); font-size: 9px; font-weight: 800; }
.question-review .prompt { flex: 1; min-width: 0; font-size: 10px; line-height: 1.5; font-weight: 650; }
.answer-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.answer-box { padding: 8px 9px; border-radius: 8px; background: #f0f5f1; }
.answer-box.bad { background: #fcf0ec; }
.answer-box .label { font-size: 8px; color: var(--muted); }
.answer-box .value { margin-top: 3px; font-size: 12px; font-weight: 800; color: var(--green); }
.answer-box.bad .value { color: var(--coral); }
.verdict-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.verdict-btns { display: flex; gap: 5px; }
.verdict-btn { min-height: 27px; padding: 4px 9px; border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--muted); font-size: 9px; font-weight: 750; }
.verdict-btn:hover { border-color: var(--line-strong); }
.verdict-btn.ok.active { border-color: #c8e2d3; background: var(--mint); color: var(--green); }
.verdict-btn.no.active { border-color: #f0d0c7; background: var(--coral-soft); color: var(--coral); }
.comment-card { padding: 16px; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,0.78); }
.comment-card .textarea { min-height: 70px; }
.voice-strip { display: flex; align-items: center; gap: 9px; margin-top: 9px; padding: 9px 11px; border: 1px dashed var(--line-strong); border-radius: 10px; background: #fbfaf5; }
.voice-strip .wave-mini { display: flex; align-items: center; gap: 2px; height: 18px; }
.wave-mini i { width: 2px; border-radius: 2px; background: var(--green-3); }
.voice-strip.recording .wave-mini i { animation: pulse 0.8s ease-in-out infinite alternate; }
@keyframes pulse { from { opacity: 0.35; transform: scaleY(0.55); } to { opacity: 1; transform: scaleY(1); } }

/* ---------- Student app ---------- */
.student-page {
  min-height: 100vh;
  display: flex; justify-content: center;
  padding: 0 16px 88px;
  background:
    radial-gradient(circle at 16% 18%, rgba(74,138,111,0.1), transparent 28%),
    radial-gradient(circle at 84% 72%, rgba(214,160,74,0.12), transparent 30%),
    #edeae1;
}
.student-shell {
  width: 100%; max-width: 520px; min-height: 100vh;
  background: var(--bg);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.6), 0 30px 80px rgba(31,45,38,0.16);
}
.student-top {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  min-height: 66px; padding: 14px 20px 10px;
  background: rgba(244,241,233,0.9); backdrop-filter: blur(16px);
}
.student-greet { font-size: 10px; color: var(--muted); }
.student-name { margin-top: 2px; font-size: 18px; font-weight: 800; letter-spacing: -0.035em; }
.student-content { padding: 8px 20px 30px; }
.student-hero {
  position: relative; overflow: hidden;
  padding: 22px;
  color: #fff;
  border-radius: 24px;
  background:
    radial-gradient(circle at 88% 15%, rgba(214,160,74,0.3), transparent 30%),
    linear-gradient(145deg, #245b46, #12362a);
  box-shadow: 0 18px 36px rgba(20,61,49,0.18);
}
.student-hero::after { content: ""; position: absolute; width: 190px; height: 190px; right: -90px; bottom: -110px; border: 1px solid rgba(255,255,255,0.14); border-radius: 50%; box-shadow: 0 0 0 26px rgba(255,255,255,0.03); }
.student-hero h3 { position: relative; z-index: 1; margin: 0; max-width: 260px; font-size: 23px; line-height: 1.25; font-weight: 800; letter-spacing: -0.04em; }
.student-hero p { position: relative; z-index: 1; margin: 7px 0 0; font-size: 10px; color: rgba(255,255,255,0.58); }
.student-hero-row { position: relative; z-index: 1; display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; margin-top: 20px; }
.streak { display: flex; align-items: center; gap: 7px; font-size: 9px; font-weight: 700; color: rgba(255,255,255,0.72); }
.streak b { font-size: 17px; color: #f1c97f; }
.student-ring { position: relative; z-index: 1; display: grid; place-items: center; width: 58px; height: 58px; border-radius: 50%; background: conic-gradient(#e4b96b calc(var(--p) * 1%), rgba(255,255,255,0.13) 0); }
.student-ring::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: #1b4737; }
.student-ring span { position: relative; z-index: 1; font-size: 10px; font-weight: 800; }
.student-section { margin-top: 22px; }
.student-section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.student-section-head h3 { margin: 0; font-size: 13px; font-weight: 800; letter-spacing: -0.02em; }
.student-section-head a { font-size: 9px; font-weight: 750; color: var(--green-2); }
.assignment-card { display: block; padding: 16px; border: 1px solid var(--line); border-radius: 18px; background: rgba(255,255,255,0.78); transition: 0.2s ease; }
.assignment-card + .assignment-card { margin-top: 8px; }
.assignment-card:hover { transform: translateY(-1px); border-color: rgba(36,87,67,0.2); background: #fff; box-shadow: var(--shadow); }
.assignment-top { display: flex; align-items: flex-start; gap: 10px; }
.assignment-type { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; }
.assignment-type.write { color: var(--green); background: var(--mint); }
.assignment-type.read { color: #8a641f; background: var(--gold-soft); }
.assignment-card .title { font-size: 11px; font-weight: 800; line-height: 1.4; }
.assignment-card .sub { margin-top: 3px; font-size: 8px; color: var(--muted); }
.assignment-bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 13px; padding-top: 11px; border-top: 1px solid var(--line); font-size: 8px; color: var(--muted); }
.due { display: inline-flex; align-items: center; gap: 4px; }
.due.urgent { color: var(--coral); font-weight: 750; }
.student-stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.student-stat { padding: 13px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,0.65); }
.student-stat b { display: block; font-size: 20px; font-weight: 800; letter-spacing: -0.04em; }
.student-stat span { display: block; margin-top: 3px; font-size: 8px; color: var(--muted); }
.bottom-nav {
  position: fixed; z-index: 30; bottom: 0; left: 50%; transform: translateX(-50%);
  display: flex; justify-content: space-around;
  width: 100%; max-width: 520px; padding: 9px 10px calc(9px + env(safe-area-inset-bottom));
  border-top: 1px solid rgba(215,208,194,0.75);
  background: rgba(250,248,242,0.92); backdrop-filter: blur(18px);
}
.bottom-link { display: grid; justify-items: center; gap: 3px; width: 54px; padding: 4px 0; color: var(--muted-2); font-size: 8px; font-weight: 650; }
.bottom-link.active { color: var(--green); }
.bottom-link.active .icon { transform: translateY(-1px); }

/* ---------- Student flow ---------- */
.student-page-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.student-page-head h2 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -0.03em; }
.student-page-head p { margin: 3px 0 0; font-size: 9px; color: var(--muted); }
.step-bar { display: flex; align-items: center; gap: 6px; margin-bottom: 16px; }
.step-dot { display: flex; align-items: center; gap: 5px; color: var(--muted-2); font-size: 8px; font-weight: 750; }
.step-dot i { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: #e9e5da; font-style: normal; font-size: 8px; }
.step-dot.active { color: var(--green); }
.step-dot.active i { color: #fff; background: var(--green); }
.step-dot.done i { color: var(--green); background: var(--mint); }
.step-line { flex: 1; height: 1px; background: var(--line); }
.upload-zone { display: grid; place-items: center; min-height: 230px; padding: 26px; border: 1.5px dashed var(--line-strong); border-radius: 22px; background: rgba(255,255,255,0.55); text-align: center; transition: 0.2s ease; }
.upload-zone:hover { border-color: var(--green-3); background: #fff; }
.upload-icon { display: grid; place-items: center; width: 62px; height: 62px; margin-bottom: 12px; border-radius: 20px; color: var(--green); background: var(--mint); }
.upload-zone h3 { margin: 0; font-size: 14px; font-weight: 800; }
.upload-zone p { max-width: 280px; margin: 7px 0 0; font-size: 9px; line-height: 1.7; color: var(--muted); }
.tip-card { display: flex; align-items: flex-start; gap: 10px; padding: 12px 13px; border-radius: 13px; background: var(--gold-soft); color: #72501a; font-size: 9px; line-height: 1.6; }
.scan-preview { position: relative; overflow: hidden; border-radius: 16px; }
.recognition-list { display: grid; gap: 6px; margin-top: 10px; }
.recognition-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: #fff; font-size: 9px; }
.recognition-item b { color: var(--green); }
.recognition-item .conf { margin-left: auto; color: var(--muted); font-size: 8px; }
.success-card { display: grid; justify-items: center; padding: 30px 20px; text-align: center; border: 1px solid var(--line); border-radius: 24px; background: rgba(255,255,255,0.75); }
.success-mark { display: grid; place-items: center; width: 68px; height: 68px; margin-bottom: 13px; border-radius: 50%; color: var(--green); background: var(--mint); }
.success-card h3 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -0.03em; }
.success-card p { margin: 7px 0 0; font-size: 9px; line-height: 1.6; color: var(--muted); }

.passage-card { padding: 20px; border: 1px solid var(--line); border-radius: 22px; background: rgba(255,255,255,0.78); }
.passage-meta { display: flex; align-items: center; gap: 7px; margin-bottom: 12px; }
.passage-text { font-family: var(--serif); font-size: 16px; line-height: 2; color: var(--ink); letter-spacing: 0.002em; }
.passage-text .w { display: inline; border-radius: 3px; cursor: pointer; }
.passage-text .w:hover { background: var(--mint); }
.passage-text .w.err { color: var(--coral); background: var(--coral-soft); padding: 1px 2px; }
.read-actions { display: flex; gap: 8px; margin-top: 18px; }
.recording-stage { display: grid; justify-items: center; padding: 28px 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(255,255,255,0.76); text-align: center; }
.mic-button { display: grid; place-items: center; width: 94px; height: 94px; border: 0; border-radius: 50%; color: #fff; background: linear-gradient(145deg, #3d8467, #245743); box-shadow: 0 16px 32px rgba(36,87,67,0.24); transition: 0.2s ease; }
.mic-button:hover { transform: scale(1.03); }
.mic-button.recording { background: linear-gradient(145deg, #d27a63, #b55441); animation: micPulse 1.4s ease-in-out infinite; }
@keyframes micPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(203,106,85,0.28); } 50% { box-shadow: 0 0 0 16px rgba(203,106,85,0); } }
.record-timer { margin-top: 18px; font-size: 34px; font-weight: 800; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
.record-hint { margin-top: 5px; font-size: 9px; color: var(--muted); }
.wave-bars { display: flex; align-items: center; justify-content: center; gap: 3px; height: 48px; margin-top: 16px; }
.wave-bars i { width: 3px; height: 8px; border-radius: 3px; background: var(--green-3); opacity: 0.75; }
.wave-bars.active i { animation: wave 0.9s ease-in-out infinite alternate; }
@keyframes wave { from { height: 6px; opacity: 0.35; } to { height: var(--h, 30px); opacity: 1; } }
.score-hero { display: grid; justify-items: center; padding: 24px; border-radius: 24px; background: linear-gradient(145deg, #eef7f1, #fbfcf9); border: 1px solid #dcebe1; }
.score-ring { display: grid; place-items: center; width: 124px; height: 124px; border-radius: 50%; background: conic-gradient(var(--green) calc(var(--p) * 1%), #dfece3 0); position: relative; }
.score-ring::after { content: ""; position: absolute; inset: 10px; border-radius: 50%; background: #f4faf6; }
.score-ring-content { position: relative; z-index: 1; text-align: center; }
.score-ring-content b { display: block; font-size: 36px; line-height: 1; font-weight: 800; letter-spacing: -0.06em; }
.score-ring-content span { display: block; margin-top: 3px; font-size: 8px; color: var(--muted); }
.dimension-list { display: grid; gap: 10px; margin-top: 18px; }
.dimension-row { display: grid; grid-template-columns: 44px 1fr 28px; align-items: center; gap: 9px; font-size: 9px; }
.dimension-row .bar { height: 6px; overflow: hidden; border-radius: 999px; background: #e8e4da; }
.dimension-row .bar span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #79ab8d, var(--green)); }
.dimension-row b { text-align: right; font-size: 10px; font-weight: 800; }
.error-word { display: flex; align-items: center; gap: 9px; padding: 10px 11px; border: 1px solid var(--line); border-radius: 11px; background: #fff; }
.error-word .word { font-size: 11px; font-weight: 800; color: var(--coral); }
.error-word .ipa { font-size: 8px; color: var(--muted); }
.error-word .play { margin-left: auto; }

/* ---------- Admin extras ---------- */
.seat-card { display: flex; align-items: center; gap: 18px; padding: 20px; border: 1px solid #e8dcc3; border-radius: 20px; background: linear-gradient(135deg, #fcf5e7, #fffaf1); }
.seat-ring { position: relative; display: grid; place-items: center; width: 88px; height: 88px; border-radius: 50%; background: conic-gradient(var(--gold) calc(var(--p) * 1%), #efe6d5 0); }
.seat-ring::after { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: #fffaf1; }
.seat-ring span { position: relative; z-index: 1; text-align: center; font-size: 13px; font-weight: 800; line-height: 1.1; }
.seat-ring span small { display: block; margin-top: 2px; font-size: 7px; font-weight: 650; color: var(--muted); }
.permission-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.permission-item { padding: 14px; border: 1px solid var(--line); border-radius: 13px; background: rgba(255,255,255,0.65); }
.permission-item b { display: block; font-size: 10px; }
.permission-item span { display: block; margin-top: 4px; font-size: 8px; line-height: 1.55; color: var(--muted); }
.log-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.log-row:last-child { border-bottom: 0; }
.log-dot { width: 7px; height: 7px; margin-top: 4px; border-radius: 50%; background: var(--green-3); }
.log-text { font-size: 9px; line-height: 1.55; }
.log-time { margin-top: 2px; font-size: 8px; color: var(--muted); }

/* ---------- Empty / modal / toast ---------- */
.empty { display: grid; justify-items: center; padding: 44px 20px; text-align: center; color: var(--muted); }
.empty-icon { display: grid; place-items: center; width: 52px; height: 52px; margin-bottom: 11px; border-radius: 17px; color: var(--green-3); background: var(--mint); }
.empty h3 { margin: 0; font-size: 13px; font-weight: 800; color: var(--ink); }
.empty p { margin: 5px 0 0; max-width: 280px; font-size: 9px; line-height: 1.65; }
.modal-root { position: relative; z-index: 100; }
.modal-backdrop { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(16,29,24,0.38); backdrop-filter: blur(5px); animation: fade 0.18s ease; }
.modal { width: min(520px, 100%); max-height: min(86vh, 760px); overflow: auto; border-radius: 22px; background: #fbf9f3; box-shadow: var(--shadow-lg); animation: pop 0.22s ease; }
.modal.wide { width: min(760px, 100%); }
.modal.xwide { width: min(980px, 100%); }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 20px 22px 0; }
.modal-title { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -0.03em; }
.modal-sub { margin: 5px 0 0; font-size: 9px; line-height: 1.6; color: var(--muted); }
.modal-body { padding: 18px 22px 22px; }
.modal-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 0 22px 22px; }
.modal-close { display: grid; place-items: center; width: 30px; height: 30px; border: 0; border-radius: 9px; background: #f0ede5; color: var(--muted); }
.modal-close:hover { background: #e8e4da; color: var(--ink); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(0.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
.toast-root { position: fixed; z-index: 200; right: 22px; bottom: 22px; display: grid; gap: 8px; }
.toast { display: flex; align-items: center; gap: 8px; min-width: 210px; max-width: 360px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 11px; background: #fff; box-shadow: var(--shadow); font-size: 10px; font-weight: 650; animation: toastIn 0.24s ease; }
.toast .toast-mark { display: grid; place-items: center; width: 21px; height: 21px; border-radius: 7px; color: var(--green); background: var(--mint); }
.toast.error .toast-mark { color: var(--coral); background: var(--coral-soft); }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.progress-hero { display: grid; grid-template-columns: 1fr 1.2fr; gap: 18px; align-items: center; padding: 20px; border: 1px solid var(--line); border-radius: 20px; background: rgba(255,255,255,0.7); }
.bar-chart { display: flex; align-items: flex-end; gap: 9px; height: 110px; padding-top: 8px; }
.bar-col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; height: 100%; }
.bar-col .bar { width: 100%; max-width: 22px; min-height: 3px; border-radius: 5px 5px 2px 2px; background: linear-gradient(180deg, var(--green-3), var(--green)); opacity: 0.35; }
.bar-col.today .bar { opacity: 1; }
.bar-col span { font-size: 8px; color: var(--muted); }
.bar-col b { font-size: 8px; font-weight: 750; color: var(--ink); }
.weak-list { display: grid; gap: 9px; }
.weak-row { display: grid; grid-template-columns: 1fr 54px 30px; align-items: center; gap: 9px; font-size: 9px; }
.weak-row .bar { height: 5px; overflow: hidden; border-radius: 999px; background: #e9e5da; }
.weak-row .bar span { display: block; height: 100%; border-radius: inherit; background: var(--coral); }
.weak-row b { text-align: right; font-size: 9px; font-weight: 800; }

.stepper { display: flex; align-items: center; gap: 7px; margin-bottom: 18px; }
.stepper-item { display: flex; align-items: center; gap: 5px; color: var(--muted-2); font-size: 8px; font-weight: 750; }
.stepper-item i { display: grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; background: #eae6dc; font-style: normal; font-size: 8px; }
.stepper-item.active { color: var(--green); }
.stepper-item.active i { color: #fff; background: var(--green); }
.stepper-item.done i { color: var(--green); background: var(--mint); }
.stepper-line { flex: 1; height: 1px; background: var(--line); }
.choice-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
.choice-card { display: flex; align-items: center; gap: 9px; padding: 12px; text-align: left; border: 1px solid var(--line); border-radius: 12px; background: #fff; transition: 0.16s ease; }
.choice-card:hover { border-color: var(--green-3); }
.choice-card.active { border-color: var(--green); background: var(--mint-2); box-shadow: 0 0 0 2px rgba(36,87,67,0.06); }
.choice-card .stat-icon { width: 32px; height: 32px; }
.choice-card b { display: block; font-size: 10px; }
.choice-card span { display: block; margin-top: 2px; font-size: 8px; color: var(--muted); }
.select-list { display: grid; gap: 7px; max-height: 230px; overflow: auto; }
.select-item { display: flex; align-items: center; gap: 9px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; text-align: left; }
.select-item:hover { border-color: var(--green-3); }
.select-item.active { border-color: var(--green); background: var(--mint-2); }
.select-item .grow { min-width: 0; }
.select-item b { display: block; font-size: 10px; }
.select-item span { display: block; margin-top: 2px; font-size: 8px; color: var(--muted); }
.summary-box { padding: 14px; border-radius: 12px; background: var(--mint-2); border: 1px solid #d9e9df; font-size: 9px; line-height: 1.7; color: var(--ink-soft); }

/* ---------- Responsive ---------- */
@media (max-width: 1180px) {
  .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .class-grid, .library-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .studio-layout { grid-template-columns: 190px minmax(340px, 1fr); }
  .studio-layout .inspector { grid-column: 1 / -1; position: static; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px 16px; }
  .studio-layout .inspector .field { margin-top: 0; }
}
@media (max-width: 980px) {
  :root { --sidebar-w: 0px; }
  .sidebar { display: none; }
  .main { margin-left: 0; }
  .topbar { padding: 0 20px; }
  .page { padding: 24px 20px 50px; }
  .teacher-hero { flex-direction: column; gap: 18px; }
  .teacher-hero-side { padding-left: 0; padding-top: 18px; border-left: 0; border-top: 1px solid rgba(255,255,255,0.1); }
  .grid-3, .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grading-grid { grid-template-columns: 1fr; }
  .split-main { grid-template-columns: 1fr; }
  .paper-panel { position: static; max-width: 520px; margin: 0 auto; width: 100%; }
  .login-page { grid-template-columns: 1fr; }
  .login-hero { min-height: auto; padding: 36px 30px 42px; }
  .login-hero h1 { font-size: 42px; }
  .login-hero-copy { padding: 36px 0 18px; }
  .login-panel { min-height: auto; padding: 42px 30px 50px; }
  .studio-layout { grid-template-columns: 1fr; }
  .studio-layout .inspector { grid-column: auto; grid-template-columns: 1fr 1fr; }
  .template-list { display: flex; overflow: auto; padding-bottom: 2px; }
  .template-item { min-width: 170px; }
}
@media (max-width: 720px) {
  .topbar { height: 60px; padding: 0 14px; }
  .topbar-crumb { display: none; }
  .page { padding: 20px 14px 44px; }
  .page-head { align-items: flex-start; flex-direction: column; gap: 13px; }
  .page-head h1 { font-size: 28px; }
  .page-actions { width: 100%; justify-content: flex-start; }
  .grid-2, .grid-3, .grid-4, .class-grid, .library-grid, .choice-grid { grid-template-columns: 1fr; }
  .stat-grid { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
  .stat-card { padding: 14px; }
  .stat-value { font-size: 24px; }
  .quick-actions { grid-template-columns: 1fr; }
  .filter-bar { align-items: stretch; flex-direction: column; }
  .search-box { min-width: 0; }
  .teacher-hero { padding: 22px; }
  .teacher-hero-side { justify-content: space-between; gap: 8px; }
  .hero-stat strong { font-size: 23px; }
  .filter-tabs { overflow: auto; }
  .grading-row { flex-wrap: wrap; }
  .grading-row .btn { margin-left: auto; }
  .margin-mobile-none { margin: 0 !important; }
  .login-hero, .login-panel { padding-left: 22px; padding-right: 22px; }
  .login-hero h1 { font-size: 36px; }
  .login-flow { gap: 6px; }
  .login-flow span { font-size: 9px; }
  .login-hero-foot { display: none; }
  .studio-layout .inspector { grid-template-columns: 1fr; }
  .student-page { padding: 0 0 84px; }
  .student-shell { box-shadow: none; }
  .student-content { padding: 8px 15px 26px; }
  .student-top { padding-left: 15px; padding-right: 15px; }
  .passage-text { font-size: 15px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
}

/* ============================================================
   Focused Apple-inspired experience
   ============================================================ */
:root {
  --focus-bg: #f5f5f7;
  --focus-surface: #ffffff;
  --focus-ink: #1d1d1f;
  --focus-muted: #6e6e73;
  --focus-line: #e5e5ea;
  --focus-accent: #1f7a53;
  --focus-soft-green: #e8f5ee;
  --focus-soft-red: #fff0f0;
}

.focus-app,
.student-page,
.simple-login {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  color: var(--focus-ink);
  background: var(--focus-bg);
  -webkit-font-smoothing: antialiased;
}

.focus-app button,
.student-page button,
.simple-login button { font-family: inherit; }

.focus-top {
  position: sticky;
  top: 0;
  z-index: 50;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 24px;
  height: 54px;
  padding: 0 32px;
  border-bottom: 1px solid rgba(0,0,0,0.06);
  background: rgba(245,245,247,0.82);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
}

.focus-brand,
.student-brand {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  width: max-content;
  color: var(--focus-ink);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.035em;
}

.focus-brand-mark {
  display: inline-grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 9px;
  color: #fff;
  background: var(--focus-ink);
}

.focus-brand-mark .icon { width: 15px; height: 15px; }

.focus-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(255,255,255,0.72);
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}

.focus-nav a {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 30px;
  padding: 0 15px;
  border-radius: 999px;
  color: var(--focus-muted);
  font-size: 13px;
  font-weight: 500;
  transition: 0.18s ease;
}

.focus-nav a:hover { color: var(--focus-ink); background: rgba(0,0,0,0.035); }
.focus-nav a.active { color: var(--focus-ink); background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.08); font-weight: 600; }
.focus-nav a span { display: grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; color: #fff; background: #ff3b30; font-size: 10px; font-weight: 700; }

.focus-actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
.focus-text-btn { border: 0; background: transparent; color: var(--focus-muted); font-size: 12px; cursor: pointer; }
.focus-text-btn:hover { color: var(--focus-ink); }
.focus-profile { display: flex; align-items: center; gap: 7px; color: var(--focus-ink); font-size: 12px; font-weight: 600; }
.focus-profile .avatar { width: 28px; height: 28px; }

.teacher-focus-main {
  width: min(1120px, 100%);
  margin: 0 auto;
  padding: 84px 28px 110px;
}

.focus-hero {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 32px;
  margin-bottom: 58px;
}

.focus-eyebrow {

  font-weight: 650;
  letter-spacing: 0.01em;
}

.focus-hero h1 {
  margin: 0;
  font-size: clamp(44px, 6.2vw, 72px);
  line-height: 1.02;
  font-weight: 700;
  letter-spacing: -0.065em;
}

.focus-lead {
  max-width: 620px;
  margin: 18px 0 0;
  color: var(--focus-muted);
  font-size: 17px;
  line-height: 1.55;
  letter-spacing: -0.015em;
}

.focus-hero-compact { align-items: center; margin-bottom: 36px; }
.focus-hero-compact h1 { font-size: clamp(40px, 5vw, 60px); }

.focus-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 44px;
  padding: 0 20px;
  border: 0;
  border-radius: 999px;
  color: #fff;
