}

.focus-primary:hover { transform: translateY(-1px); background: #000; box-shadow: 0 8px 20px rgba(0,0,0,0.14); }
.focus-secondary { display: inline-flex; align-items: center; gap: 5px; color: var(--focus-accent); font-size: 13px; font-weight: 650; white-space: nowrap; }
.focus-secondary:hover { text-decoration: underline; }
.focus-back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 32px; color: var(--focus-muted); font-size: 13px; font-weight: 550; }
.focus-back:hover { color: var(--focus-ink); }

.focus-section { margin-top: 58px; }
.focus-section-last { margin-top: 36px; }
.focus-section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
.focus-section-head h2 { margin: 0; font-size: 24px; font-weight: 650; letter-spacing: -0.04em; }
.focus-section-head > span { color: var(--focus-muted); font-size: 13px; }

.teacher-class-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.teacher-class-tile {
  display: flex;
  min-height: 286px;
  flex-direction: column;
  padding: 28px;
  border: 1px solid rgba(0,0,0,0.025);
  border-radius: 30px;
  color: var(--focus-ink);
  background: var(--focus-surface);
  box-shadow: 0 8px 30px rgba(0,0,0,0.055), inset 0 1px 0 rgba(255,255,255,0.9);
  transition: 0.25s cubic-bezier(.2,.7,.3,1);
}

.teacher-class-tile:hover { transform: translateY(-5px); box-shadow: 0 20px 45px rgba(0,0,0,0.09), inset 0 1px 0 #fff; }
.teacher-class-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
.class-index { color: #b0b0b5; font-size: 12px; font-weight: 650; letter-spacing: 0.04em; }
.class-open { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; color: var(--focus-muted); background: #f5f5f7; transition: 0.2s ease; }
.teacher-class-tile:hover .class-open { color: #fff; background: var(--focus-ink); }
.teacher-class-tile h3 { margin: 0; font-size: 31px; line-height: 1.1; font-weight: 650; letter-spacing: -0.055em; }
.teacher-class-tile > p { margin: 8px 0 0; color: var(--focus-muted); font-size: 13px; line-height: 1.5; }
.class-tile-foot { margin-top: auto; padding-top: 30px; }
.class-hand-row { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--focus-muted); }
.class-hand-row strong { color: var(--focus-ink); font-size: 15px; }
.mini-hand { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 9px; color: var(--focus-accent); background: var(--focus-soft-green); }
.mini-hand .icon { width: 14px; height: 14px; }
.class-pending { margin-left: auto; color: #b9655f; }
.focus-progress { height: 4px; margin: 12px 0 10px; overflow: hidden; border-radius: 999px; background: #ececf0; }
.focus-progress i { display: block; height: 100%; border-radius: inherit; background: var(--focus-accent); transition: width 0.4s ease; }
.class-task-name { display: block; overflow: hidden; color: #8a8a8f; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
.class-empty-state { display: flex; align-items: center; gap: 7px; color: var(--focus-muted); font-size: 12px; }

.focus-quiet-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 24px 26px; border: 1px solid rgba(0,0,0,0.035); border-radius: 22px; background: rgba(255,255,255,0.72); }
.focus-quiet-row strong { display: block; font-size: 15px; font-weight: 650; }
.focus-quiet-row span { display: block; margin-top: 3px; color: var(--focus-muted); font-size: 12px; }

.focus-count { display: grid; place-items: center; min-width: 112px; padding: 18px 22px; border-radius: 26px; background: #fff; box-shadow: 0 8px 25px rgba(0,0,0,0.055); }
.focus-count span { font-size: 38px; line-height: 1; font-weight: 650; letter-spacing: -0.06em; }
.focus-count small { margin-top: 5px; color: var(--focus-muted); font-size: 11px; }

.roster-legend { display: flex; align-items: center; gap: 24px; margin: 0 0 18px; color: var(--focus-muted); font-size: 12px; }
.roster-legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; }
.legend-dot.done { background: #bce8d0; }
.legend-dot.missed { background: #ffd3d3; }
.class-roster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }

.roster-tile {
  display: flex;
  min-height: 154px;
  flex-direction: column;
  align-items: flex-start;
  padding: 20px;
  text-align: left;
  border: 1px solid transparent;
  border-radius: 24px;
  color: var(--focus-ink);
  background: #fff;
  box-shadow: 0 7px 24px rgba(0,0,0,0.055), inset 0 1px 0 #fff;
  transition: 0.22s cubic-bezier(.2,.7,.3,1);
}

button.roster-tile { cursor: pointer; }
.roster-tile:hover { transform: translateY(-3px); box-shadow: 0 18px 36px rgba(0,0,0,0.085), inset 0 1px 0 #fff; }
.roster-tile-top { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-bottom: 15px; }
.roster-avatar { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 14px; color: #4a4a4f; background: #f1f1f4; font-size: 17px; font-weight: 650; }
.raised-hand { display: grid; place-items: center; width: 35px; height: 35px; border-radius: 50%; color: var(--focus-accent); background: var(--focus-soft-green); }
.raised-hand .icon { width: 17px; height: 17px; }
.roster-tile strong { font-size: 16px; font-weight: 650; letter-spacing: -0.02em; }
.roster-tile > span:not(.roster-tile-top):not(.roster-foot) { margin-top: 4px; color: var(--focus-muted); font-size: 11px; }
.roster-foot { display: flex; align-items: center; gap: 5px; margin-top: auto; padding-top: 14px; color: #8b8b90; font-size: 11px; }
.roster-foot .icon { width: 13px; height: 13px; }
.roster-tile.complete .roster-foot { color: var(--focus-accent); }
.roster-tile.missed { background: var(--focus-soft-red); border-color: #ffe0e0; box-shadow: 0 7px 24px rgba(190,70,70,0.045), inset 0 1px 0 rgba(255,255,255,0.7); }
.roster-tile.missed .roster-avatar { color: #a95a55; background: #ffe3e3; }
.missed-mark { display: grid; place-items: center; width: 35px; height: 35px; border-radius: 50%; color: #b76059; background: rgba(255,255,255,0.58); }
.roster-tile.missed .roster-foot { color: #b65f58; font-weight: 600; }
.roster-tile.reminded { background: #f7f7f9; border-color: #ececf0; box-shadow: none; }
.roster-tile.reminded .roster-avatar { color: #818186; background: #eaeaee; }
.roster-tile.reminded .roster-foot { color: #7c7c81; }
.roster-tile.neutral { background: #fff; }

/* Student home */
.student-page { display: block; min-height: 100vh; padding: 0 0 96px; background: var(--focus-bg); }
.student-shell { width: 100%; max-width: 960px; min-height: 100vh; margin: 0 auto; padding: 0 28px; background: transparent; box-shadow: none; }
.student-top { min-height: 62px; padding: 14px 0 10px; background: rgba(245,245,247,0.82); border-bottom: 1px solid rgba(0,0,0,0.045); }
.student-top .avatar { width: 34px; height: 34px; }
.student-top-right { display: flex; align-items: center; gap: 12px; }
.student-points-pill { display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 999px; color: var(--focus-muted); background: #fff; font-size: 11px; font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
.student-content { padding: 72px 0 40px; }
.student-focus-hero { align-items: center; margin-bottom: 54px; }
.student-focus-hero h1 { font-size: clamp(42px, 6vw, 64px); }
.student-score-card { min-width: 180px; padding: 24px 26px; border-radius: 26px; background: #fff; box-shadow: 0 9px 30px rgba(0,0,0,0.06); }
.student-score-card strong { display: block; font-size: 48px; line-height: 0.95; font-weight: 650; letter-spacing: -0.065em; }
.student-score-card > span { display: block; margin-top: 8px; color: var(--focus-muted); font-size: 11px; }
.student-score-card .focus-progress { margin-bottom: 0; }
.student-task-stack { display: grid; gap: 14px; }

.student-task-tile {
  display: grid;
  grid-template-columns: 46px 52px minmax(0, 1fr) 64px 34px;
  align-items: center;
  gap: 16px;
  min-height: 106px;
  padding: 20px 22px;
  border: 1px solid rgba(0,0,0,0.025);
  border-radius: 26px;
  color: var(--focus-ink);
  background: #fff;
  box-shadow: 0 9px 28px rgba(0,0,0,0.06), inset 0 1px 0 #fff;
  transition: 0.22s cubic-bezier(.2,.7,.3,1);
}

.student-task-tile:hover { transform: translateY(-3px); box-shadow: 0 18px 38px rgba(0,0,0,0.09), inset 0 1px 0 #fff; }
.student-task-tile.done { background: #fafafa; box-shadow: 0 4px 16px rgba(0,0,0,0.035); }
.task-index { color: #b3b3b8; font-size: 11px; font-weight: 650; letter-spacing: 0.05em; }
.task-index small { display: block; margin-top: 3px; color: #c7c7cb; font-size: 9px; font-weight: 500; }
.task-icon { display: grid; place-items: center; width: 50px; height: 50px; border-radius: 17px; }
.task-icon.write { color: #266648; background: #eaf6ef; }
.task-icon.read { color: #8d651d; background: #fbf3e4; }
.task-copy { min-width: 0; }
.task-copy strong { display: block; overflow: hidden; font-size: 16px; font-weight: 650; letter-spacing: -0.025em; text-overflow: ellipsis; white-space: nowrap; }
.task-copy > span { display: block; margin-top: 5px; color: var(--focus-muted); font-size: 11px; line-height: 1.45; }
.task-points { color: #9a9aa0; font-size: 17px; font-weight: 650; letter-spacing: -0.03em; text-align: right; }
.task-points small { display: block; margin-top: 2px; color: #b0b0b5; font-size: 9px; font-weight: 500; }
.task-points.earned { color: var(--focus-accent); }
.task-go { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; color: var(--focus-muted); background: #f5f5f7; }
.student-task-tile.done .task-go { color: var(--focus-accent); background: var(--focus-soft-green); }

.all-done-banner { display: flex; align-items: center; gap: 16px; margin: 0 0 46px; padding: 22px 24px; border-radius: 24px; color: var(--focus-accent); background: var(--focus-soft-green); }
.all-done-banner strong { display: block; color: var(--focus-ink); font-size: 16px; font-weight: 650; }
.all-done-banner span { display: block; margin-top: 3px; color: #5d806c; font-size: 12px; }

.student-voice-note { display: flex; align-items: center; gap: 14px; width: 100%; padding: 20px 22px; text-align: left; border: 0; border-radius: 24px; color: var(--focus-ink); background: #fff; box-shadow: 0 8px 26px rgba(0,0,0,0.055); cursor: pointer; }
.student-voice-note:hover { transform: translateY(-2px); box-shadow: 0 16px 34px rgba(0,0,0,0.08); }
.voice-note-play { display: grid; place-items: center; flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%; color: #fff; background: var(--focus-ink); }
.voice-note-duration { color: var(--focus-muted); font-size: 11px; }

.bottom-nav { max-width: 960px; border-top: 1px solid rgba(0,0,0,0.06); background: rgba(245,245,247,0.88); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.bottom-link { color: #8e8e93; font-size: 10px; }
.bottom-link.active { color: var(--focus-ink); }

.student-page-head { padding-top: 28px; }
.student-page-head h2 { font-size: 21px; font-weight: 650; letter-spacing: -0.04em; }
.student-page-head p { font-size: 11px; }
.daily-flow-progress { height: 3px; margin: 0 0 24px; overflow: hidden; border-radius: 999px; background: #e7e7eb; }
.daily-flow-progress i { display: block; height: 100%; border-radius: inherit; background: var(--focus-accent); transition: width 0.35s ease; }

.task-complete-card { display: grid; justify-items: center; max-width: 580px; margin: 40px auto 0; padding: 54px 34px 42px; text-align: center; border-radius: 32px; background: #fff; box-shadow: 0 16px 48px rgba(0,0,0,0.075); }
.task-complete-mark { display: grid; place-items: center; width: 58px; height: 58px; margin-bottom: 20px; border-radius: 50%; color: #fff; background: var(--focus-accent); }
.task-complete-card h1 { margin: 0; font-size: 64px; line-height: 1; font-weight: 650; letter-spacing: -0.07em; }
.task-complete-card h1 span { margin-left: 7px; color: var(--focus-muted); font-size: 16px; font-weight: 550; letter-spacing: 0; }
.task-complete-card > p:not(.focus-eyebrow) { margin: 16px 0 0; color: var(--focus-muted); font-size: 14px; }
.task-complete-card .focus-progress { width: min(300px, 80%); margin-top: 24px; }

.flow-advance-banner { display: flex; align-items: center; gap: 12px; margin: 0 0 18px; padding: 14px 18px; border-radius: 18px; background: var(--focus-soft-green); }
.flow-advance-banner > span { padding: 4px 9px; border-radius: 999px; color: #fff; background: var(--focus-accent); font-size: 11px; font-weight: 650; }
.flow-advance-banner strong { flex: 1; color: var(--focus-ink); font-size: 12px; font-weight: 600; }
.flow-advance-banner a { color: var(--focus-accent); font-size: 11px; font-weight: 650; }

/* Voice feedback */
.feedback-person { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 20px; background: #fff; box-shadow: 0 5px 18px rgba(0,0,0,0.045); }
.feedback-person strong { display: block; font-size: 15px; font-weight: 650; letter-spacing: -0.02em; }
.feedback-person strong span { margin-left: 4px; color: var(--focus-muted); font-size: 11px; font-weight: 500; }
.feedback-person p { margin: 4px 0 0; color: var(--focus-muted); font-size: 10px; }
.feedback-tone-row { display: flex; align-items: center; gap: 8px; margin: 16px 0 12px; }
.feedback-tone-row > span { margin-left: auto; color: var(--focus-muted); font-size: 10px; }
.feedback-tone { height: 32px; padding: 0 13px; border: 1px solid var(--focus-line); border-radius: 999px; color: var(--focus-muted); background: #fff; font-size: 11px; font-weight: 600; cursor: pointer; }
.feedback-tone.active { color: #fff; background: var(--focus-ink); border-color: var(--focus-ink); }
.voice-message-recorder { display: grid; justify-items: center; gap: 7px; padding: 22px; border-radius: 24px; background: #fff; box-shadow: 0 7px 24px rgba(0,0,0,0.05); }
.voice-message-recorder.recording { background: #fff7f7; }
.voice-message-recorder.ready { justify-items: stretch; }
.voice-record-button { display: grid; place-items: center; width: 66px; height: 66px; border: 0; border-radius: 50%; color: #fff; background: var(--focus-ink); cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.14); }
.voice-record-button.recording { background: #ff3b30; animation: voicePulse 1s ease-in-out infinite alternate; }
.voice-message-recorder > strong { font-size: 14px; font-weight: 650; }
.voice-message-recorder > span { color: var(--focus-muted); font-size: 10px; }
.voice-live-wave { display: flex; align-items: center; justify-content: center; gap: 3px; height: 38px; }
.voice-live-wave i { width: 3px; border-radius: 3px; background: #ff6b61; animation: pulse 0.7s ease-in-out infinite alternate; }
.voice-ready { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.voice-ready-mark { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; color: #fff; background: var(--focus-accent); }
.voice-ready strong { font-size: 13px; font-weight: 650; }
.voice-ready span:last-child { margin-left: auto; color: var(--focus-muted); font-size: 10px; }
.voice-message-recorder.ready .btn { justify-self: end; }
.feedback-suggestions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
.feedback-suggestions button { height: 30px; padding: 0 11px; border: 1px solid var(--focus-line); border-radius: 999px; color: var(--focus-muted); background: #fff; font-size: 10px; cursor: pointer; }
.feedback-suggestions button:hover { color: var(--focus-ink); border-color: #c8c8cd; }
.feedback-send-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 20px; }
.feedback-send-row > span { display: flex; align-items: center; gap: 5px; color: var(--focus-muted); font-size: 9px; }
.feedback-send-row .focus-primary { min-height: 40px; }

/* Simple login */
.simple-login { min-height: 100vh; }
.simple-login-top { display: flex; align-items: center; justify-content: space-between; height: 58px; padding: 0 32px; color: #9a9aa0; font-size: 10px; font-weight: 650; letter-spacing: 0.16em; }
.simple-login-main { width: min(940px, 100%); margin: 0 auto; padding: 90px 28px 90px; }
.simple-login-main h1 { margin: 0; font-size: clamp(52px, 8vw, 88px); line-height: 0.98; font-weight: 700; letter-spacing: -0.075em; }
.simple-login-lead { max-width: 520px; margin: 22px 0 0; color: var(--focus-muted); font-size: 17px; line-height: 1.55; }
.simple-role-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-top: 58px; }
.simple-role-card { position: relative; display: flex; min-height: 220px; flex-direction: column; align-items: flex-start; padding: 26px; border-radius: 28px; color: var(--focus-ink); background: #fff; box-shadow: 0 10px 32px rgba(0,0,0,0.06), inset 0 1px 0 #fff; transition: 0.25s cubic-bezier(.2,.7,.3,1); }
.simple-role-card:hover { transform: translateY(-5px); box-shadow: 0 22px 46px rgba(0,0,0,0.1), inset 0 1px 0 #fff; }

.simple-role-icon { display: grid; place-items: center; width: 46px; height: 46px; margin-bottom: auto; border-radius: 15px; color: var(--focus-ink); background: #f2f2f5; }
.simple-role-card strong { margin-top: 28px; font-size: 24px; font-weight: 650; letter-spacing: -0.04em; }
.simple-role-card > span:not(.simple-role-icon) { margin-top: 7px; color: var(--focus-muted); font-size: 12px; }
.simple-login-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 34px; color: #8e8e93; font-size: 10px; }

.focus-hero-actions { display: flex; align-items: center; gap: 18px; }
.focus-secondary { border: 0; background: transparent; padding: 0; cursor: pointer; }

/* Content studio */
.studio-stepper { display: flex; align-items: center; gap: 12px; margin: 0 0 30px; color: #a0a0a5; font-size: 11px; font-weight: 600; }
.studio-stepper span { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.studio-stepper span i { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: #e8e8ec; color: #77777c; font-style: normal; font-size: 10px; }
.studio-stepper span.active { color: var(--focus-ink); }
.studio-stepper span.active i { color: #fff; background: var(--focus-ink); }
.studio-stepper span.done { color: var(--focus-accent); }
.studio-stepper span.done i { color: #fff; background: var(--focus-accent); }
.studio-stepper b { flex: 1; height: 1px; background: #dedee3; }
.studio-shell { padding: 32px; border-radius: 30px; background: #fff; box-shadow: 0 12px 38px rgba(0,0,0,0.065); }
.studio-type-switch { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; background: #f2f2f5; }
.studio-type-switch button { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 15px; border: 0; border-radius: 999px; color: var(--focus-muted); background: transparent; font-size: 12px; font-weight: 600; cursor: pointer; }
.studio-type-switch button.active { color: var(--focus-ink); background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
.studio-field-grid { display: grid; grid-template-columns: 1.4fr .8fr 1fr 1fr; gap: 14px; margin-top: 26px; }
.studio-field { display: grid; gap: 7px; }
.studio-field > span { color: var(--focus-muted); font-size: 10px; font-weight: 600; }
.studio-field input,
.studio-field select,
.studio-field textarea { width: 100%; border: 1px solid #e1e1e6; border-radius: 13px; outline: 0; color: var(--focus-ink); background: #fafafa; font-family: inherit; font-size: 12px; }
.studio-field input,
.studio-field select { height: 42px; padding: 0 12px; }
.studio-field textarea { min-height: 220px; padding: 13px; line-height: 1.7; resize: vertical; }
.studio-field input:focus,

.studio-field textarea:focus { border-color: #b7b7bd; background: #fff; box-shadow: 0 0 0 3px rgba(0,0,0,0.045); }
.studio-upload-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(240px, .65fr); gap: 18px; margin-top: 26px; }
.studio-upload-card { display: flex; min-height: 310px; flex-direction: column; align-items: center; justify-content: center; gap: 9px; padding: 28px; text-align: center; border: 1.5px dashed #d7d7dc; border-radius: 24px; background: #fafafa; }
.studio-upload-card.compact { min-height: 260px; }
.studio-upload-icon { display: grid; place-items: center; width: 54px; height: 54px; border-radius: 18px; color: var(--focus-ink); background: #fff; box-shadow: 0 5px 18px rgba(0,0,0,0.06); }
.studio-upload-card > strong { margin-top: 4px; font-size: 15px; font-weight: 650; }
.studio-upload-card > span { color: var(--focus-muted); font-size: 10px; line-height: 1.5; }
.studio-upload-card .focus-primary { margin-top: 8px; min-height: 38px; cursor: pointer; }
.studio-demo-link { border: 0; background: transparent; color: #7f7f84; font-size: 10px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.studio-image-preview { width: min(360px, 100%); max-height: 210px; object-fit: cover; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
.studio-file-name { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; overflow: hidden; color: #6f6f74; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
.studio-explain-card { padding: 28px; border-radius: 24px; background: #f7f7f9; }
.studio-explain-row { display: flex; gap: 12px; padding: 16px 0; border-bottom: 1px solid #e7e7eb; color: var(--focus-ink); font-size: 12px; line-height: 1.5; }
.studio-explain-row:last-child { border-bottom: 0; }
.studio-explain-row b { color: #b0b0b5; font-size: 10px; }
.studio-reading-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(260px, .6fr); gap: 18px; margin-top: 26px; }
.studio-passage-field { align-content: start; }
.studio-passage-field textarea { min-height: 300px; }
.studio-upload-card audio,
.teacher-audio { width: 100%; margin-top: 8px; }
.teacher-audio-note { display: flex; align-items: center; gap: 6px; margin-top: 4px; color: var(--focus-muted); font-size: 10px; }
.student-keywords { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
.student-keywords span,
.studio-keywords span { padding: 8px 11px; border-radius: 12px; color: #66666b; background: #f5f5f7; font-size: 10px; }
.student-keywords b,
.studio-keywords b { display: block; margin-bottom: 2px; color: var(--focus-ink); font-size: 11px; }
.studio-actions { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 28px; padding-top: 22px; border-top: 1px solid #eeeef1; }
.studio-actions > span { color: var(--focus-muted); font-size: 11px; }
.studio-generating { display: grid; justify-items: center; padding: 72px 24px; text-align: center; border-radius: 30px; background: #fff; box-shadow: 0 12px 38px rgba(0,0,0,0.065); }
.studio-generating-icon { display: grid; place-items: center; width: 74px; height: 74px; margin-bottom: 22px; border-radius: 24px; color: #fff; background: var(--focus-ink); animation: voicePulse 1.4s ease-in-out infinite alternate; }
.studio-generating h2 { margin: 0; font-size: 25px; font-weight: 650; letter-spacing: -0.04em; }
.studio-generating p { margin: 10px 0 24px; color: var(--focus-muted); font-size: 13px; }
.studio-generating .focus-progress { width: min(360px, 80%); }
.studio-generating-note { margin-top: 16px; color: #9a9aa0; font-size: 10px; }
.studio-review-layout { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(290px, .65fr); gap: 24px; align-items: start; }
.studio-review-main { min-width: 0; }
.studio-review-main .focus-section-head { align-items: flex-start; }
.studio-review-main .focus-section-head > span { max-width: 380px; text-align: right; line-height: 1.5; }
.studio-answer-card { margin-bottom: 12px; padding: 20px; border-radius: 22px; background: #fff; box-shadow: 0 6px 22px rgba(0,0,0,0.045); }
.studio-answer-head { display: flex; align-items: flex-start; gap: 10px; }
.studio-answer-head .grow strong { display: block; font-size: 13px; font-weight: 600; line-height: 1.55; }
.studio-answer-head .grow span { display: block; margin-top: 4px; color: var(--focus-muted); font-size: 9px; }
.studio-options { margin-top: 10px; padding: 10px 12px; border-radius: 12px; color: #6c6c71; background: #f7f7f9; font-size: 11px; line-height: 1.6; white-space: pre-wrap; }
.studio-review-fields { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px; margin-top: 14px; }
.studio-publish-card { position: sticky; top: 82px; display: grid; gap: 12px; padding: 26px; border-radius: 26px; background: #fff; box-shadow: 0 12px 38px rgba(0,0,0,0.07); }
.studio-publish-card h2 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.04em; }
.studio-publish-card > p { margin: 0; color: var(--focus-muted); font-size: 11px; }
.studio-publish-list { display: grid; gap: 8px; padding: 14px 0; border-top: 1px solid #eeeef1; border-bottom: 1px solid #eeeef1; }
.studio-publish-list span { display: flex; align-items: center; gap: 7px; color: #5f5f64; font-size: 10px; }
.studio-publish-list .icon { color: var(--focus-accent); }
.studio-publish-card .focus-primary { width: 100%; }
.studio-publish-card .studio-demo-link { justify-self: center; }
.studio-reading-review { display: grid; gap: 12px; }
.studio-keywords { display: grid; gap: 8px; }
.studio-keywords span { padding: 12px; }

/* Adaptive practice */
.remedial-card { display: flex; align-items: center; gap: 14px; margin-top: 14px; padding: 18px 20px; border-radius: 22px; color: var(--focus-ink); background: #fff; box-shadow: 0 7px 24px rgba(0,0,0,0.055); transition: 0.2s ease; }
.remedial-card:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(0,0,0,0.08); }
.remedial-icon { display: grid; place-items: center; flex: 0 0 auto; width: 46px; height: 46px; border-radius: 15px; color: #a95a55; background: #fff0f0; }
.remedial-card.done .remedial-icon { color: var(--focus-accent); background: var(--focus-soft-green); }
.remedial-score { color: var(--focus-accent); font-size: 12px; font-weight: 650; white-space: nowrap; }
.remedial-intro { display: flex; align-items: center; gap: 15px; margin: 24px 0; padding: 20px; border-radius: 22px; background: #fff; box-shadow: 0 7px 24px rgba(0,0,0,0.05); }
.remedial-intro strong { display: block; font-size: 16px; font-weight: 650; }
.remedial-intro p { margin: 4px 0 0; color: var(--focus-muted); font-size: 11px; line-height: 1.5; }
.remedial-form { display: grid; gap: 14px; }
.remedial-question { padding: 22px; border-radius: 24px; background: #fff; box-shadow: 0 7px 24px rgba(0,0,0,0.055); }
.remedial-question.correct { box-shadow: 0 7px 24px rgba(31,122,83,0.07); }
.remedial-question.wrong { box-shadow: 0 7px 24px rgba(190,70,70,0.06); }
.remedial-question-head { display: flex; align-items: flex-start; gap: 11px; }
.remedial-question-head > span:first-child { display: grid; place-items: center; flex: 0 0 auto; width: 28px; height: 28px; border-radius: 9px; color: #85858a; background: #f2f2f5; font-size: 10px; font-weight: 650; }
.remedial-question-head strong { flex: 1; padding-top: 5px; font-size: 13px; line-height: 1.55; }
.remedial-question .studio-field { margin-top: 14px; }
.remedial-answer-line { display: flex; gap: 22px; margin-top: 14px; color: var(--focus-muted); font-size: 11px; }
.remedial-answer-line b { color: var(--focus-ink); }
.remedial-explanation { margin: 10px 0 0; padding: 12px 14px; border-radius: 12px; color: #5e6f64; background: #f2f8f4; font-size: 11px; line-height: 1.65; }
.remedial-result { display: flex; align-items: center; gap: 14px; padding: 24px; border-radius: 24px; background: #fff; box-shadow: 0 9px 30px rgba(0,0,0,0.06); }
.remedial-result strong { font-size: 30px; font-weight: 650; letter-spacing: -0.05em; }
.remedial-result span { flex: 1; color: var(--focus-muted); font-size: 11px; line-height: 1.5; }
.task-auto-score { margin-top: 8px !important; color: var(--focus-accent) !important; font-size: 13px !important; }
.task-auto-score b { font-size: 24px; letter-spacing: -0.04em; }

.modal { background: #f5f5f7; border-radius: 28px; }
.modal-title { font-size: 19px; font-weight: 650; letter-spacing: -0.035em; }
.modal-sub { color: var(--focus-muted); font-size: 11px; }
.modal-close { border-radius: 50%; background: #e9e9ed; color: #77777c; }
.modal-close:hover { background: #dedee3; color: var(--focus-ink); }
.modal .textarea { border-color: #e1e1e6; border-radius: 14px; background: #fff; font-size: 12px; }
.modal .textarea:focus { border-color: #b9b9c0; box-shadow: 0 0 0 3px rgba(0,0,0,0.05); }
.modal .btn { border-radius: 999px; }

@keyframes voicePulse { from { transform: scale(1); box-shadow: 0 8px 20px rgba(255,59,48,0.18); } to { transform: scale(1.05); box-shadow: 0 12px 26px rgba(255,59,48,0.32); } }

@media (max-width: 920px) {
  .focus-top { grid-template-columns: 1fr auto; height: auto; min-height: 54px; padding: 8px 20px 0; row-gap: 2px; }
  .focus-nav { display: flex; grid-column: 1 / -1; justify-self: center; margin-bottom: 6px; }

  .student-content { padding-top: 54px; }

  .studio-upload-grid,
  .studio-reading-grid,
  .studio-review-layout { grid-template-columns: 1fr; }
  .studio-publish-card { position: static; }
}

@media (max-width: 640px) {
  .focus-hero { align-items: flex-start; flex-direction: column; gap: 24px; margin-bottom: 40px; }

  .focus-lead { font-size: 15px; }
  .teacher-focus-main { padding: 48px 16px 84px; }
  .teacher-class-grid { grid-template-columns: 1fr; }
  .teacher-class-tile { min-height: 240px; padding: 24px; }
  .focus-section { margin-top: 42px; }
  .focus-quiet-row { align-items: flex-start; flex-direction: column; }
  .class-roster-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .roster-tile { min-height: 142px; padding: 15px; border-radius: 20px; }
  .roster-tile strong { font-size: 14px; }
  .roster-tile > span:not(.roster-tile-top):not(.roster-foot) { font-size: 9px; }
  .roster-foot { font-size: 9px; }
  .roster-legend { align-items: flex-start; flex-direction: column; gap: 7px; }
  .student-page { padding-bottom: 86px; }
  .student-shell { padding: 0 15px; }
  .student-content { padding-top: 42px; }
  .student-focus-hero { flex-direction: column; align-items: stretch; }
  .student-score-card { width: 100%; min-width: 0; }
  .student-task-tile { grid-template-columns: 34px 44px minmax(0, 1fr) 30px; gap: 10px; min-height: 96px; padding: 16px; border-radius: 22px; }
  .task-icon { width: 42px; height: 42px; border-radius: 14px; }
  .task-copy strong { font-size: 14px; }
  .task-points { display: none; }
  .bottom-nav { max-width: 100%; }
  .feedback-send-row { align-items: stretch; flex-direction: column; }
  .feedback-send-row .focus-primary { width: 100%; }
  .simple-login-main { padding: 64px 20px 60px; }
  .simple-login-main h1 { font-size: 52px; }
  .simple-login-top { padding: 0 20px; }
  .simple-login-foot { align-items: flex-start; flex-direction: column; gap: 10px; }
  .focus-hero-actions { width: 100%; justify-content: space-between; }
  .studio-shell { padding: 20px; border-radius: 24px; }
  .studio-actions { align-items: stretch; flex-direction: column; }
  .studio-actions .focus-primary { width: 100%; }
  .studio-field-grid,
  .studio-review-fields { grid-template-columns: 1fr; }
  .studio-stepper { gap: 7px; font-size: 9px; }
  .studio-stepper span { gap: 4px; }
  .studio-stepper span i { width: 21px; height: 21px; }
  .studio-review-main .focus-section-head > span { text-align: left; }
  .studio-upload-card { min-height: 250px; padding: 20px; }
  .remedial-result { align-items: flex-start; flex-direction: column; }
  .remedial-result .focus-primary { width: 100%; }
  .remedial-answer-line { flex-direction: column; gap: 5px; }
}

function ico(name, cls = "") {
  return `<svg class="icon ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ICONS.more}</svg>`;
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

function pct(value) {
  return Math.max(0, Math.min(100, Math.round(Number(value) || 0)));
}

function pad2(value) {
  return String(value).padStart(2, "0");
}

function greeting() {
  const hour = new Date().getHours();
  if (hour < 6) return "夜深了";
  if (hour < 11) return "早上好";
  if (hour < 14) return "中午好";
  if (hour < 19) return "下午好";
  return "晚上好";
}

function longDate() {
  const date = new Date();
  const week = ["日", "一", "二", "三", "四", "五", "六"][date.getDay()];
  return `${date.getMonth() + 1} 月 ${date.getDate()} 日 · 星期${week}`;
}

function currentTime() {
  const date = new Date();
  return `${pad2(date.getHours())}:${pad2(date.getMinutes())}`;
}

let idCounter = 100;
function nextId(prefix) {
  idCounter += 1;
  return `${prefix}-${Date.now().toString(36)}-${idCounter}`;
}

const AVATAR_COLORS = ["#2f6b55", "#5c769f", "#b07c47", "#7d6c9b", "#4f8a85", "#a65f4e", "#6e8a4f", "#8b6a56"];
function avatar(name, size = "", extra = "") {
  const text = String(name || "?").trim().slice(0, 1) || "?";
  let hash = 0;
  for (let i = 0; i < String(name).length; i += 1) hash = (hash * 31 + String(name).charCodeAt(i)) % 997;
  const color = AVATAR_COLORS[hash % AVATAR_COLORS.length];
  return `<span class="avatar ${size} ${extra}" style="background:${color}">${esc(text)}</span>`;
}

function taskPoints(assignment) {
  return assignment?.type === "reading" ? 15 : assignment?.type === "vocab" ? 10 : 20;
}

function earnedPoints(submission) {
  if (!submission) return 0;
  return Number(submission.pointsEarned ?? taskPoints(getAssignment(submission.assignmentId)));
}

function todayPoints(studentId = ui.studentId) {
  const activeIds = new Set(studentAssignmentsForClass().filter(item => item.status === "active").map(item => item.id));
  return studentSubmissions(studentId)
    .filter(item => activeIds.has(item.assignmentId))
    .reduce((sum, item) => sum + earnedPoints(item), 0);
}

function routeForAssignment(assignment) {
  return assignment?.type === "reading" ? `#/student/read/${assignment.id}` : `#/student/write/${assignment.id}`;
}

function startStudentFlow(assignmentId) {
  const pending = studentAssignmentsForClass()
    .filter(item => item.status === "active" && !submissionFor(item.id, ui.studentId));
  const index = pending.findIndex(item => item.id === assignmentId);
  const ordered = index > 0 ? [...pending.slice(index), ...pending.slice(0, index)] : pending;
  ui.flow = {
    active: true,
    queue: (ordered.length ? ordered : pending).map(item => item.id),
    pointsEarned: todayPoints(ui.studentId),
    lastAward: 0,
    finished: false
  };
  location.hash = routeForAssignment(getAssignment(assignmentId));
  render();
}

function ensureStudentFlow(assignmentId) {
  if (ui.flow.active && ui.flow.queue.length) return;
  const active = studentAssignmentsForClass().filter(item => item.status === "active");
  const index = active.findIndex(item => item.id === assignmentId);
  const ordered = index > 0 ? [...active.slice(index), ...active.slice(0, index)] : active;
  ui.flow = {
    active: true,
    queue: ordered.map(item => item.id),
    pointsEarned: todayPoints(ui.studentId),
    lastAward: 0,
    finished: false
  };
}

function flowNextTask() {
  const ids = ui.flow.queue || [];
  return ids.map(getAssignment).find(item => item && item.status === "active" && !submissionFor(item.id, ui.studentId)) || null;
}

function recordTaskCompletion(assignment) {
  ensureStudentFlow(assignment.id);
  ui.flow.active = true;
  ui.flow.finished = false;
  ui.flow.lastAward = taskPoints(assignment);
  ui.flow.pointsEarned = todayPoints(ui.studentId);
}

function scheduleStudentAdvance(delay = 1800, fromAssignmentId = null) {
  const next = flowNextTask();
  if (next) {
    schedule(() => {
      if (fromAssignmentId && location.hash !== routeForAssignment(getAssignment(fromAssignmentId))) return;
      ui.flow.lastAward = 0;
      location.hash = routeForAssignment(next);
      render();
      toast("下一份作业已打开");
    }, delay);
    return;
  }
  schedule(() => {
    if (fromAssignmentId && location.hash !== routeForAssignment(getAssignment(fromAssignmentId))) return;
    ui.flow.active = false;
    ui.flow.finished = true;
    location.hash = "#/student/home";
    render();
    toast("今天的作业全部完成了");
  }, delay);
}

function buildReadingDraft(title, text) {
  const cleanText = String(text || "").trim();
  const words = cleanText ? cleanText.split(/\s+/).filter(Boolean).length : 0;

  const keyWords = Object.entries(READING_WORD_NOTES)
    .filter(([word]) => lower.includes(word))
    .map(([word, note]) => ({ word, note }))
    .slice(0, 5);
  return {
    type: "reading",
    summary: `已分析《${title || "新课文"}》，共 ${words} 词。已生成朗读重点，发布前请老师试听并核对。`,
    words,
    keyWords: keyWords.length ? keyWords : [

function wrongAnswerFor(question) {
  if (question.type === "choice") {
    return question.answer === "A" ? "B" : "A";
  }
  if (question.answer === "likes") return "like";
  if (question.answer === "was") return "were";
  if (question.answer === "went") return "goed";
  if (question.answer === "visited") return "visit";
  return `${question.answer}s`;
}

function buildStudentAttempt(template) {
  const questions = template?.questions || [];
  const missAt = new Set([2, Math.min(7, Math.max(0, questions.length - 2)), Math.max(0, questions.length - 1)]);
  const answers = questions.map((question, index) => missAt.has(index) ? wrongAnswerFor(question) : question.answer);
  const verdicts = questions.map((question, index) => !missAt.has(index));
  const score = questions.length ? Math.round((verdicts.filter(Boolean).length / questions.length) * 100) : 0;
  return { answers, verdicts, score };
}

function openRemedials(studentId = ui.studentId) {

function createRemedialSet(submission, assignment, template) {
  if (remedialForSubmission(submission.id)) return remedialForSubmission(submission.id);
  let questions = [];
  let reason = "";
  if (submission.type === "worksheet") {
    const wrong = (template?.questions || []).filter((question, index) => !submission.aiVerdict?.[index]);
    if (wrong.length < 2) return null;
    const used = new Set();
    wrong.forEach(question => {
      if (questions.length >= 4) return;
      const candidates = REMEDIAL_BANK.filter(item => item.type === question.type && !used.has(item.prompt));
      const picked = candidates[0] || REMEDIAL_BANK.find(item => !used.has(item.prompt));
      if (picked) {
        used.add(picked.prompt);
        questions.push(clone(picked));
      }
    });
    reason = `这次有 ${wrong.length} 道题需要再巩固，系统生成了 ${questions.length} 道同知识点练习。`;
  } else {
    const errors = submission.errors || [];
    if (errors.length < 2) return null;
    questions = errors.slice(0, 3).map((word, index) => ({
      type: "fill",
      prompt: `听写复习 ${index + 1}：根据提示写出单词「${READING_WORD_NOTES[word] || "注意这个词的发音"}」`,
      answer: word,
      knowledge: "朗读 · 易错词",
      explanation: READING_WORD_NOTES[word] || `再读一次 ${word}，注意词尾不要吞音。`
    }));
    reason = `这次有 ${errors.length} 个词发音不够稳定，系统生成了 ${questions.length} 道词汇复习。`;
  }
  if (!questions.length) return null;
  const remedial = {
    id: nextId("rem"),
    submissionId: submission.id,
    assignmentId: assignment.id,
    studentId: submission.studentId,
    questions,
    answers: null,
    score: null,
    status: "open",
    reason,
    createdAt: "刚刚"
  };
  state.remedials.unshift(remedial);
  return remedial;
}

function normalizeAnswer(value) {
  return String(value ?? "").toLowerCase().replace(/[.,!?;:'"“”‘’\s]/g, "");
}

function isCorrectAnswer(value, answer) {
  return normalizeAnswer(value) === normalizeAnswer(answer);
}

function worksheetScore(submission) {
  const assignment = getAssignment(submission.assignmentId);
  const template = getTemplate(assignment?.templateId);
  if (!template || !template.questions.length) return submission.score ?? submission.aiScore ?? 0;
  const total = template.questions.reduce((sum, question) => sum + (question.points || 10), 0);
  let earned = 0;
  template.questions.forEach((question, index) => {
    const decision = submission.review?.[index] ?? submission.aiVerdict?.[index] ?? isCorrectAnswer(submission.answers?.[index], question.answer);
    if (decision) earned += question.points || 10;
  });
  return total ? Math.round((earned / total) * 100) : 0;
}

function displayScore(submission) {
  if (!submission) return null;
  if (submission.type === "reading") return submission.teacherScore ?? submission.score ?? submission.aiScore ?? 0;
  return submission.status === "graded" ? submission.score ?? worksheetScore(submission) : submission.aiScore ?? worksheetScore(submission);
}

function currentWorksheetScore(submission) {
  return worksheetScore(submission);
}

function assignmentForStudent(assignmentId, studentId) {
  return state.assignments.find(item => {
    if (item.id !== assignmentId) return false;
    const student = getStudent(studentId);
    return student && item.classId === student.classId;

}

function studentAssignmentStatus(assignment, studentId) {
  const sub = submissionFor(assignment.id, studentId);
  if (!sub) return assignment.status === "closed" ? "未提交" : "待完成";
  if (sub.status === "graded") return "已批改";
  return "待老师确认";
}

function statusChip(status) {
  const map = {
    active: ["进行中", "green"],
    closed: ["已结束", "gray"],
    draft: ["草稿", "gold"],
    ai: ["待老师确认", "gold"],
    graded: ["已批改", "green"],
    published: ["已上架", "green"],
    pending: ["待完成", "coral"],
    todo: ["待完成", "coral"]
  };
  const [label, cls] = map[status] || [status, "gray"];
  return `<span class="chip ${cls}"><i class="status-dot"></i>${label}</span>`;
}

function studentStatusChip(assignment, studentId) {
  const sub = submissionFor(assignment.id, studentId);
  if (!sub) {
    return assignment.status === "closed"
      ? `<span class="chip gray">未提交</span>`
      : `<span class="chip coral">待完成</span>`;
  }
  return sub.status === "graded"
    ? `<span class="chip green">已批改 · ${displayScore(sub)} 分</span>`
    : `<span class="chip gold">待老师确认</span>`;
}

function assignmentProgress(assignment) {
  return assignment.total ? Math.round((assignment.submitted / assignment.total) * 100) : 0;
}

function studentNotifications(studentId) {
  return state.submissions.filter(item => item.studentId === studentId && item.status === "graded");
}

function teacherConfidence(submission) {
  return pct(submission.confidence);
}

function lowConfidence(submission) {
  return teacherConfidence(submission) < 80;
}

function acceptedReviewCount(submission) {
  return Object.keys(submission.review || {}).length;
}

function addAudit(text) {
  state.audit.unshift({ text, time: `今天 ${currentTime()}` });
  state.audit = state.audit.slice(0, 12);
}

function clearTimers() {
  ui.timers.forEach(timer => clearInterval(timer));
  ui.timers = [];
  ui.timers = [];
}

function registerTimer(timer) {
  ui.timers.push(timer);
  return timer;
}

function schedule(fn, delay) {
  const timer = setTimeout(fn, delay);
  ui.timers.push(timer);
  return timer;
}

const app = document.getElementById("app");
const modalRoot = document.getElementById("modal-root");
const toastRoot = document.getElementById("toast-root");

function routeInfo() {
  const raw = (location.hash || "#/login").replace(/^#/, "");
  const parts = raw.split("/").filter(Boolean);
  return { raw, parts };
}

function render(options = {}) {
  clearTimers();
  const { parts } = routeInfo();
  const first = parts[0] || "login";
  let html = "";

  if (first === "admin") {
    ui.role = "admin";
    const page = parts[1] || "dashboard";
    const body = {
      dashboard: adminDashboard,
      people: adminPeople,
      classes: adminClasses,
      library: adminLibrary,
      settings: adminSettings
    }[page] || adminDashboard;
    html = shell("admin", page, body());
  } else if (first === "teacher") {
    ui.role = "teacher";
    const page = parts[1] || "dashboard";
    const body = {
      dashboard: teacherDashboard,
      class: () => teacherClassView(parts[2]),
      create: teacherCreateView,
      assignments: teacherAssignmentsView,
      templates: teacherTemplates,
      grading: parts[2] ? () => teacherGradingDetail(parts[2]) : teacherGrading,
      reports: teacherReports
    }[page] || teacherDashboard;
    html = shell("teacher", page, body());
  } else if (first === "student") {
    ui.role = "student";
    const page = parts[1] || "home";
    let body = studentHome;
    let active = "home";
    if (page === "assignments") { body = studentAssignments; active = "assignments"; }
    if (page === "reading") { body = studentReadingList; active = "reading"; }
    if (page === "profile") { body = studentProfile; active = "profile"; }
    if (page === "write") { body = () => studentWrite(parts[2]); active = "assignments"; }
    if (page === "read") { body = () => studentRead(parts[2]); active = "reading"; }
    if (page === "remedial") { body = () => studentRemedial(parts[2]); active = "home"; }
    html = studentShell(body(), active);
  } else {
    ui.role = "login";
    html = loginView();
  }

  app.innerHTML = html;
  if (!options.keepScroll) window.scrollTo(0, 0);
  afterRender();
}

function statCard(label, value, icon, tone = "green", foot = "") {
  return `

}

function weeklyChart(values, labels = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"], todayIndex = 4) {
  const max = Math.max(...values, 1);
  return `
    <div class="bar-chart">
      ${values.map((value, index) => `
        <div class="bar-col ${index === todayIndex ? "today" : ""}">
          <b>${value}</b>
          <div class="bar" style="height:${Math.max(4, (value / max) * 82)}%"></div>
          <span>${labels[index]}</span>
        </div>`).join("")}
    </div>`;
}

function emptyState(icon, title, text) {
  return `<div class="empty"><div class="empty-icon">${ico(icon, "lg")}</div><h3>${title}</h3><p>${text}</p></div>`;

function teacherClassView(classId) {
  const classItem = getClass(classId);
  if (!classItem) return emptyState("alert", "找不到这个班级", "返回班级列表看看。");
  const roster = classStudents(classId);
  const assignment = classCurrentAssignment(classId);
  const done = assignment ? roster.filter(student => submissionFor(assignment.id, student.id)) : [];
  return `
    <a class="focus-back" href="#/teacher/dashboard">${ico("arrowLeft", "sm")} 返回班级</a>
    <section class="focus-hero focus-hero-compact">
      <div>
        <p class="focus-eyebrow">${classItem.grade} · ${classItem.schedule}</p>
        <h1>${classItem.name}</h1>
        <p class="focus-lead">${assignment ? `今天：${assignment.title} · ${done.length} / ${roster.length} 人已交` : "今天没有进行中的作业。"} 当前展示 ${roster.length} 位示例学生。</p>
      </div>
      ${assignment ? `<div class="focus-count"><span>${done.length}</span><small>已交</small></div>` : ""}
    </section>

    <div class="roster-legend">
      <span><i class="legend-dot done"></i>已交 · 点名字留语音评语</span>
      <span><i class="legend-dot missed"></i>未交 · 点一下催交</span>
    </div>

    <div class="class-roster-grid">
      ${roster.length ? roster.map(student => {
        const sub = assignment ? submissionFor(assignment.id, student.id) : null;
        const note = latestVoiceNotes(student.id, 1)[0];
        if (sub) {
          return `<button class="roster-tile complete" data-action="student-feedback" data-student="${student.id}" data-assignment="${assignment.id}">
            <span class="roster-tile-top"><span class="roster-avatar">${esc(student.name.slice(0, 1))}</span><span class="raised-hand">${ico("hand", "sm")}</span></span>
            <strong>${student.name}</strong>
            <span>${student.english} · ${sub.status === "graded" ? "已批改" : "待确认"} ${displayScore(sub)} 分</span>
            <span class="roster-foot">${note ? `${ico("mic", "sm")} 已有语音评语` : `${ico("message", "sm")} 点一下留评语`}</span>
          </button>`;
        }
        if (assignment) {
          const reminded = hasReminded(assignment.id, student.id);
          return `<button class="roster-tile missed ${reminded ? "reminded" : ""}" data-action="remind-student" data-student="${student.id}" data-assignment="${assignment.id}">
            <span class="roster-tile-top"><span class="roster-avatar">${esc(student.name.slice(0, 1))}</span><span class="missed-mark">${ico(reminded ? "checkCircle" : "clock", "sm")}</span></span>
            <strong>${student.name}</strong>
            <span>${student.english} · ${reminded ? "已提醒家长" : "还没有交作业"}</span>
            <span class="roster-foot">${ico(reminded ? "check" : "send", "sm")} ${reminded ? "已催交" : "点一下催交"}</span>
          </button>`;
        }
        return `<div class="roster-tile neutral"><span class="roster-tile-top"><span class="roster-avatar">${esc(student.name.slice(0, 1))}</span></span><strong>${student.name}</strong><span>${student.english} · 暂无作业</span></div>`;
      }).join("") : emptyState("users", "这个班还没有学生", "管理员添加学生后会显示在这里。")}
    </div>`;
}

function worksheetHTML(template, options = {}) {
  const {

    showAnswerKey = false
  } = options;

  return `
    <div class="worksheet-sheet ${photo ? "with-upload" : ""}" ${photo ? `style="background-image:url('${photo}')"` : ""}>
      <div class="sheet-static">
        <div class="sheet-head">
          <div><div class="sheet-school">${school}</div><div class="sheet-title">${esc(template.title)}</div><div class="tiny muted" style="font-size:6px;margin-top:2px">${esc(template.book)}</div></div>
          <div class="sheet-meta">姓名：____________<br>日期：____________<br>得分：____________</div>
        </div>
        <div class="sheet-name-line"><span>Class: ________</span><span>Time: 20 minutes</span><span>Page ${template.page}</span></div>
        <div class="sheet-instruction">Read each question carefully and write your answer in the blank.</div>
        ${template.questions.map((question, index) => {
          const value = studentAnswers ? studentAnswers[index] : "";
          const decided = verdicts ? verdicts[index] : null;
          return `<div class="sheet-q ${selectedIndex === index ? "active" : ""}" style="top:${question.y}%;left:${question.x}%;width:${question.w}%;height:${question.h}%" ${interactive ? `data-action="select-q" data-index="${index}"` : ""}>
            <span class="num">${question.no}.</span>
            <span class="q-body">
              <span class="q-text">${esc(question.prompt)}</span>
              ${question.options ? `<span class="q-options">${esc(question.options)}</span>` : ""}

              ${showAnswerKey ? `<span class="tiny" style="font-size:6px;color:#8b6a56">答案：${esc(question.answer)}</span>` : ""}

          </div>`;
        }).join("")}
        <div class="sheet-page-no">${esc(template.title)} · ${template.page}</div>
      </div>
      ${scan ? `<div class="scan-overlay"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span><span class="scan-line"></span></div>` : ""}
    </div>`;
}

function teacherGradingDetail(id) {
  const sub = getSubmission(id);
  if (!sub) return emptyState("alert", "找不到这份作业", "它可能已经被删除，返回批改中心看看。");
  const student = getStudent(sub.studentId);
  const assignment = getAssignment(sub.assignmentId);
  if (!student || !assignment) return emptyState("alert", "数据不完整", "作业或学生信息缺失。");
  const isWorksheet = sub.type === "worksheet";
  const template = isWorksheet ? getTemplate(assignment.templateId) : null;
  const passage = !isWorksheet ? getPassage(assignment.passageId) : null;
  const decisions = template ? template.questions.map((question, index) => sub.review?.[index] ?? sub.aiVerdict?.[index] ?? isCorrectAnswer(sub.answers?.[index], question.answer)) : [];
  const score = isWorksheet ? currentWorksheetScore(sub) : (sub.teacherScore ?? sub.aiScore);
  const comment = sub.teacherComment || "";
  const readOnly = sub.status === "graded";
  return `
    <div class="between mb-16">
      <div class="row"><a class="icon-btn" href="#/teacher/grading">${ico("arrowLeft", "sm")}</a><div><div class="eyebrow">批改详情</div><div class="strong" style="font-size:15px">${student.name} · ${assignment.title}</div></div></div>
      <div class="row">${sub.status === "graded" ? '<span class="chip green">已返回学生</span>' : '<span class="chip gold">待老师确认</span>'}<span class="tiny muted">${sub.submittedAt}</span></div>
    </div>

    <div class="grading-grid">
      <div class="paper-panel">
        <div class="card pad-sm">
          <div class="between mb-12"><div class="row">${avatar(student.name, "sm")}<div><div class="strong small">${student.name}</div><div class="tiny muted">${className(assignment.classId)} · ${student.english}</div></div></div><span class="chip gray">第 1 / 1 页</span></div>
          ${isWorksheet ? `<div class="sheet-wrap">${worksheetHTML(template, { studentAnswers: sub.answers, verdicts: decisions })}</div>` : `
            <div class="passage-card">
              <div class="passage-meta"><span class="chip gold">${passage?.grade}</span><span class="chip gray">${passage?.level}</span><span class="chip gray">${passage?.words} 词</span></div>
              <div class="strong" style="font-size:16px">${passage?.title}</div>
              <div class="passage-text mt-12" style="font-size:13px;line-height:1.9">${(passage?.text || "").split(" ").map(word => {
                const clean = word.toLowerCase().replace(/[^a-z]/g, "");
                return `<span class="w ${sub.errors?.includes(clean) ? "err" : ""}">${esc(word)}</span>`;
              }).join(" ")}</div>
            </div>
            <div class="card pad-sm mt-12"><div class="between"><div class="row"><button class="icon-btn" data-action="play-reading" title="播放">${ico("play", "sm")}</button><span class="small strong">学生录音 · ${sub.duration}</span></div><span class="chip blue">模拟音频</span></div><div class="mt-12">${readingWaveform(false)}</div></div>`}
        </div>
        <div class="tip-card mt-12">${ico("scan", "sm")}<span>${isWorksheet ? "照片已自动裁边并按模板对齐。虚线框为识别区域，绿色/红色为 AI 判定。" : "朗读评分基于发音、流利度、完整度与语调四个维度；点击单词可听标准发音。"}</span></div>
      </div>

      <div class="review-panel">
        <div class="review-summary">
          <div class="review-summary-top">
            <div class="big-score" data-score-big>${score}<small>分</small></div>
            <div class="grow"><div class="row"><span class="chip gold">AI 初批 ${sub.aiScore} 分</span><span class="chip ${lowConfidence(sub) ? "coral" : "green"}">置信度 ${sub.confidence}%</span></div><div class="tiny muted mt-8">${isWorksheet ? "选择题和填空题可直接确认；连词成句建议看一眼。" : "低置信词已标红，建议重点检查。"}</div></div>
            ${readOnly ? "" : `<button class="btn soft sm" data-action="accept-all" data-id="${sub.id}">全部采纳</button>`}
          </div>
          <div class="progress thin mt-16"><span style="width:${sub.confidence}%"></span></div>
        </div>


        ${isWorksheet ? `
          ${template.questions.map((question, index) => {
            const studentAnswer = sub.answers?.[index] || "未作答";
            const decision = decisions[index];
            return `<div class="question-review ${decision ? "is-correct" : "is-wrong"}" data-qcard="${index}">
              <div class="question-review-head">
                <span class="q-no">${question.no}</span>
                <div class="prompt">${esc(question.prompt)}</div>
                <span class="chip ${decision ? "green" : "coral"}">${decision ? "AI 判对" : "AI 判错"}</span>
              </div>
              <div class="answer-compare">
                <div class="answer-box ${decision ? "" : "bad"}"><div class="label">学生答案</div><div class="value">${esc(studentAnswer)}</div></div>
                <div class="answer-box"><div class="label">标准答案</div><div class="value">${esc(question.answer)}</div></div>
              </div>
              <div class="verdict-row">
                <span class="tiny muted">${question.points || 10} 分 · AI 置信度 ${Math.max(58, sub.confidence - (index % 4) * 5)}%</span>
                ${readOnly ? "" : `<div class="verdict-btns">
                  <button class="verdict-btn ok ${decision ? "active" : ""}" data-action="set-verdict" data-id="${sub.id}" data-index="${index}" data-value="true">判对</button>
                  <button class="verdict-btn no ${!decision ? "active" : ""}" data-action="set-verdict" data-id="${sub.id}" data-index="${index}" data-value="false">判错</button>
                </div>`}
              </div>
            </div>`;
          }).join("")}
        ` : `
          <div class="card pad">
            <div class="section-head"><div><h2>四维评分</h2><p>可点击数字微调总分</p></div><span class="chip green">${sub.duration}</span></div>
            <div class="dimension-list">
              ${Object.entries({ "发音准确度": sub.dimensions.pronunciation, "流利度": sub.dimensions.fluency, "完整度": sub.dimensions.completeness, "语调": sub.dimensions.prosody }).map(([label, value]) => `<div class="dimension-row"><span>${label}</span><div class="bar"><span style="width:${value}%"></span></div><b>${value}</b></div>`).join("")}
            </div>
            <div class="field mt-16"><label>老师确认总分</label><input class="input" id="reading-score" type="number" min="0" max="100" value="${score}" ${readOnly ? "readonly" : ""}></div>
            <div class="section-head mt-16"><div><h2>需要留意的词</h2><p>点击可听标准发音</p></div></div>
            <div class="recognition-list">
              ${(sub.errors || []).map(word => `<div class="error-word"><span class="word">${word}</span><span class="ipa">/${word === "island" ? "ˈaɪlənd" : word === "wooden" ? "ˈwʊdn" : word === "climbed" ? "klaɪmd" : "ˈbjuːtɪfl"}/</span><button class="icon-btn play" data-action="speak-word" data-word="${word}">${ico("volume", "sm")}</button></div>`).join("")}
            </div>
          </div>
        `}

        <div class="comment-card">
          <div class="between mb-8"><div class="strong small">老师评语</div><span class="tiny muted">会显示在学生端</span></div>
          <textarea class="textarea" id="teacher-comment" placeholder="例如：时态掌握得不错，注意第 3 题第三人称单数。" ${readOnly ? "readonly" : ""}>${esc(comment)}</textarea>
          ${readOnly ? "" : `<div class="voice-strip" id="voice-strip">
            <button class="icon-btn" data-action="voice-comment">${ico("mic", "sm")}</button>
            <div class="grow"><div class="small strong" id="voice-title">点击录制语音评语</div><div class="tiny muted" id="voice-sub">最长 30 秒 · 原型模拟</div></div>
            <div class="wave-mini" id="voice-wave">${[8,16,12,22,10,18,7,14].map(h => `<i style="height:${h}px"></i>`).join("")}</div>
          </div>`}
        </div>

        <div class="between">
          <a class="btn ghost" href="#/teacher/grading">${ico("arrowLeft", "sm")} 返回队列</a>
          ${readOnly ? '<span class="chip green">' + ico("checkCircle", "sm") + ' 已返回</span>' : `<button class="btn primary" data-action="confirm-grade" data-id="${sub.id}">${ico("check", "sm")} 确认并返回学生</button>`}
        </div>
      </div>
    </div>`;
}

/* ============================================================
   Student views
   ============================================================ */
function studentAssignmentsForClass() {
  const student = getStudent(ui.studentId);
  if (!student) return [];
  return state.assignments.filter(item => item.classId === student.classId && item.status !== "draft");
}

function studentAssignmentCard(assignment, studentId) {
  const content = assignmentContent(assignment);
  const sub = submissionFor(assignment.id, studentId);
  const status = studentAssignmentStatus(assignment, studentId);
  const isReading = assignment.type === "reading";
  const href = isReading ? `#/student/read/${assignment.id}` : `#/student/write/${assignment.id}`;
  return `<a class="assignment-card" href="${href}" data-action="${sub ? "view-task" : "start-task"}" data-id="${assignment.id}">
    <div class="assignment-top">
      <span class="assignment-type ${isReading ? "read" : "write"}">${ico(isReading ? "mic" : "pen", "lg")}</span>
      <div class="grow"><div class="title">${assignment.title}</div><div class="sub">${isReading ? `${content?.words || 0} 词 · ${content?.level || ""}` : `${content?.questions?.length || 0} 道题 · ${content?.grade || ""}`}</div></div>
      ${studentStatusChip(assignment, studentId)}
    </div>
    <div class="assignment-bottom">
      <span class="due ${assignment.dueShort === "今天" ? "urgent" : ""}">${ico("clock", "sm")} ${assignment.due}</span>
      <span>${sub ? (sub.status === "graded" ? `老师已批改 · ${displayScore(sub)} 分` : "已提交 · 等待老师确认") : isReading ? "点击开始朗读" : "点击拍照提交"}</span>
    </div>
  </a>`;
}

function studentTaskTile(assignment, index, total) {
  const sub = submissionFor(assignment.id, ui.studentId);
  const isReading = assignment.type === "reading";
  const points = sub ? earnedPoints(sub) : taskPoints(assignment);
  return `<a class="student-task-tile ${sub ? "done" : ""}" href="${routeForAssignment(assignment)}" data-action="${sub ? "view-task" : "start-task"}" data-id="${assignment.id}">
    <span class="task-index">${pad2(index + 1)}<small>/ ${pad2(total)}</small></span>
    <span class="task-icon ${isReading ? "read" : "write"}">${ico(isReading ? "mic" : "pen", "lg")}</span>
    <span class="task-copy">
      <strong>${assignment.title}</strong>
      <span>${isReading ? "朗读" : "练习册"} · 截止 ${assignment.due} · ${sub ? (sub.status === "graded" ? "老师已批改" : "已提交") : "约 3 分钟"}</span>
    </span>
    <span class="task-points ${sub ? "earned" : ""}">${sub ? "+" + points : "+" + points}<small>积分</small></span>
    <span class="task-go">${sub ? ico("check", "sm") : ico("arrowRight", "sm")}</span>
  </a>`;
}

function studentHome() {
  const student = getStudent(ui.studentId);
  const list = studentAssignmentsForClass().filter(item => item.status === "active");
  const done = list.filter(item => submissionFor(item.id, ui.studentId));
  const todo = list.filter(item => !submissionFor(item.id, ui.studentId));
  const points = todayPoints(ui.studentId);
  const possible = list.reduce((sum, item) => sum + taskPoints(item), 0);
  const progress = possible ? Math.round((points / possible) * 100) : 0;
  const voice = latestVoiceNotes(ui.studentId, 1)[0];
  const remedials = openRemedials(ui.studentId);
  return `
    <section class="focus-hero student-focus-hero">
      <div>
        <p class="focus-eyebrow">${longDate()}</p>
        <h1>${greeting()}，${student?.name || "同学"}。</h1>
        <p class="focus-lead">${todo.length ? `今天有 ${todo.length} 份作业。完成一份，会自动进入下一份。` : "今天的作业已经全部完成。"}</p>
      </div>
      <div class="student-score-card">
        <strong>${points}</strong>
        <span>今日积分 / ${possible}</span>
        <div class="focus-progress"><i style="width:${progress}%"></i></div>
      </div>
    </section>

    ${todo.length === 0 ? `<div class="all-done-banner">${ico("checkCircle", "lg")}<div><strong>今天的任务完成了</strong><span>你获得了 ${points} 积分，明天见。</span></div></div>` : ""}

    <section class="focus-section">
      <div class="focus-section-head"><h2>今天要做</h2><span>${done.length} / ${list.length} 完成</span></div>
      <div class="student-task-stack">
        ${list.length ? list.map((item, index) => studentTaskTile(item, index, list.length)).join("") : emptyState("coffee", "今天没有作业", "休息一下，或者去朗读页读一篇短文。")}
      </div>
    </section>

    ${remedials.length ? `<section class="focus-section">
      <div class="focus-section-head"><h2>错题再练</h2><span>${remedials.length} 组</span></div>
      <div class="student-task-stack">${remedials.map(studentRemedialCard).join("")}</div>
    </section>` : ""}

    ${voice ? `<section class="focus-section focus-section-last">
      <div class="focus-section-head"><h2>老师留言</h2><span>${voice.createdAt}</span></div>
      <button class="student-voice-note" data-action="play-feedback" data-id="${voice.id}">
        <span class="voice-note-play">${ico("play", "sm")}</span>
        <span class="task-copy"><strong>Mia 老师</strong><span>${esc(voice.text)}</span></span>
        <span class="voice-note-duration">${voice.duration || "文字"}</span>
      </button>
    </section>` : ""}`;
}

function studentAssignments() {
  const list = studentAssignmentsForClass();
  const todo = list.filter(item => !submissionFor(item.id, ui.studentId) && item.status === "active");
  const submitted = list.filter(item => submissionFor(item.id, ui.studentId)?.status === "ai");
  const done = list.filter(item => submissionFor(item.id, ui.studentId)?.status === "graded");
  return `
    <div class="student-page-head"><div><h2>我的作业</h2><p>${todo.length} 份待完成 · ${submitted.length} 份待确认 · ${done.length} 份已批改</p></div><span class="chip green">六(1)班</span></div>
    ${todo.length ? `<div class="student-section" style="margin-top:0"><div class="student-section-head"><h3>待完成</h3><span class="tiny muted">${todo.length} 份</span></div>${todo.map(item => studentAssignmentCard(item, ui.studentId)).join("")}</div>` : ""}
    ${submitted.length ? `<div class="student-section"><div class="student-section-head"><h3>待老师确认</h3><span class="tiny muted">${submitted.length} 份</span></div>${submitted.map(item => studentAssignmentCard(item, ui.studentId)).join("")}</div>` : ""}
    ${done.length ? `<div class="student-section"><div class="student-section-head"><h3>已批改</h3><span class="tiny muted">${done.length} 份</span></div>${done.map(item => studentAssignmentCard(item, ui.studentId)).join("")}</div>` : ""}
    ${list.length === 0 ? emptyState("clipboard", "暂时没有作业", "新的作业会出现在这里。") : ""}`;
}
