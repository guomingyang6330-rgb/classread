        <div class="between" style="padding:14px 0;border-bottom:1px solid var(--line)"><span class="small">隐私与数据</span><span class="tiny muted">已授权</span></div>
        <div class="between" style="padding:14px 0"><span class="small">切换角色</span><a class="link-btn" href="#/login">返回入口</a></div>
      </div>
    </div>
    <button class="btn ghost block mt-16" data-action="reset-demo">${ico("refresh", "sm")} 重置演示数据</button>`;
}

function studentWrite(assignmentId) {
  const assignment = assignmentForStudent(assignmentId, ui.studentId);
  if (!assignment) return emptyState("alert", "找不到这份作业", "返回作业列表看看。");
  const existing = submissionFor(assignmentId, ui.studentId);
  if (existing) return studentWriteResult(existing, assignment);
  ensureStudentFlow(assignmentId);
  if (ui.write.assignmentId !== assignmentId) {
    ui.write = { assignmentId, step: 1, photo: null, scanning: false };
  }
  const template = getTemplate(assignment.templateId);
  if (!template) return emptyState("alert", "找不到这份练习册", "老师可能还没有完成内容上传。");
  const attempt = buildStudentAttempt(template);
  const step = ui.write.step;
  const position = ui.flow.queue.indexOf(assignmentId) + 1;
  const next = flowNextTask();
  return `
    <div class="student-page-head"><a class="icon-btn" href="#/student/home">${ico("arrowLeft", "sm")}</a><div class="grow"><h2>${assignment.title}</h2><p>第 ${position || 1} 份 / 共 ${ui.flow.queue.length || 1} 份 · 截止 ${assignment.due}</p></div>${step > 1 ? `<button class="link-btn" data-action="reset-write">重新拍</button>` : ""}</div>
    <div class="daily-flow-progress"><i style="width:${Math.round(((position - 1) / Math.max(1, ui.flow.queue.length)) * 100)}%"></i></div>
    <div class="step-bar">
      <span class="step-dot ${step >= 1 ? (step > 1 ? "done" : "active") : ""}"><i>1</i>拍照</span><span class="step-line"></span>
      <span class="step-dot ${step >= 2 ? (step > 2 ? "done" : "active") : ""}"><i>2</i>确认</span><span class="step-line"></span>
      <span class="step-dot ${step >= 3 ? "active" : ""}"><i>3</i>提交</span>
    </div>
    ${step === 1 ? `
      <div class="upload-zone">
        <div class="upload-icon">${ico("camera", "xl")}</div>
        <h3>拍下完成的练习册</h3>
        <p>把练习册放平，尽量在光线充足的地方拍照。系统会自动裁边、校正透视，并匹配第 ${template?.page || 1} 页模板。</p>
        <div class="row mt-16">
          <label class="btn primary" for="photo-input">${ico("camera", "sm")} 打开相机</label>
          <button class="btn ghost" data-action="demo-photo">${ico("image", "sm")} 使用示例照片</button>
        </div>
        <input id="photo-input" type="file" accept="image/*" capture="environment" style="display:none">
      </div>
      <div class="tip-card mt-12">${ico("lightbulb", "sm")}<span>小提示：一次拍一页，避免手指遮住答题区。示例照片会模拟 AI 识别与初批结果。</span></div>
    ` : ""}
    ${step === 2 ? `
      <div class="scan-preview">
        <div class="sheet-wrap">${worksheetHTML(template, { studentAnswers: attempt.answers, scan: ui.write.scanning, photo: ui.write.photo })}</div>
      </div>
      <div class="card pad-sm mt-12">
        <div class="between"><div class="row"><span class="stat-icon ${ui.write.scanning ? "gold" : "green"}">${ico(ui.write.scanning ? "scan" : "check", "sm")}</span><div><div class="strong small">${ui.write.scanning ? "正在识别答题区…" : "识别完成"}</div><div class="tiny muted mt-4">${ui.write.scanning ? "正在校正透视与匹配模板" : `${template.questions.length} 道题 · ${attempt.verdicts.filter(Boolean).length} 道高置信 · ${attempt.verdicts.filter(item => !item).length} 道建议复核`}</div></div></div><span class="chip ${ui.write.scanning ? "gold" : "green"}">${ui.write.scanning ? "处理中" : "可提交"}</span></div>
      </div>
      ${!ui.write.scanning ? `<div class="card pad-sm mt-12"><div class="section-head"><div><h3 style="font-size:11px;margin:0">识别到的答案</h3><p>提交后立即评分，错题会自动生成再练</p></div><span class="chip green">${template.questions.length} / ${template.questions.length}</span></div>
        <div class="recognition-list">${attempt.answers.map((answer, index) => `<div class="recognition-item"><b>${index + 1}</b><span>${esc(answer)}</span><span class="conf">${attempt.verdicts[index] ? "94%" : "76%"}</span></div>`).join("")}</div>
      </div>
      <div class="row mt-16"><button class="btn ghost" data-action="reset-write">${ico("camera", "sm")} 重拍</button><button class="btn primary grow" data-action="submit-homework" data-id="${assignment.id}">${ico("upload", "sm")} 确认并提交</button></div>` : ""}
    ` : ""}
    ${step === 3 ? `
      <div class="task-complete-card">
        <span class="task-complete-mark">${ico("check", "lg")}</span>
        <p class="focus-eyebrow">完成一份</p>
        <h1>+${ui.flow.lastAward || taskPoints(assignment)}<span>积分</span></h1>
        <p class="task-auto-score">AI 评分 <b>${displayScore(submissionFor(assignment.id, ui.studentId))}</b> 分</p>
        <p>${next ? `正在打开下一份：${next.title}` : "今天的作业全部完成了。"}</p>
        <div class="focus-progress"><i style="width:${Math.round((ui.flow.pointsEarned / Math.max(1, studentAssignmentsForClass().filter(item => item.status === "active").reduce((sum, item) => sum + taskPoints(item), 0))) * 100)}%"></i></div>
        <a class="focus-secondary mt-16" href="${next ? routeForAssignment(next) : "#/student/home"}">${next ? "如果未自动跳转，点这里" : "回到今日作业"}</a>
      </div>
    ` : ""}`;
}

function studentWriteResult(sub, assignment) {
  const graded = sub.status === "graded";
  const score = displayScore(sub);
  const template = getTemplate(assignment.templateId);
  const remedial = remedialForSubmission(sub.id);
  return `
    <div class="student-page-head"><a class="icon-btn" href="#/student/assignments">${ico("arrowLeft", "sm")}</a><div><h2>${assignment.title}</h2><p>${graded ? "老师已批改" : "已提交 · 等待老师确认"}</p></div></div>
    <div class="success-card">
      <div class="success-mark" style="color:${graded ? "var(--green)" : "var(--gold)"};background:${graded ? "var(--mint)" : "var(--gold-soft)"}">${ico(graded ? "check" : "clock", "xl")}</div>
      <h3>${graded ? "老师已批改" : "AI 已完成初批"}</h3>
      <p>${graded ? "老师确认了你的作业，并留下了评语。" : "老师确认后，最终分数和评语会显示在这里。"}</p>
      <div class="score-ring mt-16" style="--p:${score};width:108px;height:108px"><div class="score-ring-content"><b>${score}</b><span>${graded ? "最终得分" : "AI 初批"}</span></div></div>
      ${sub.teacherComment ? `<div class="tip-card mt-16" style="width:100%;text-align:left">${ico("message", "sm")}<span>${esc(sub.teacherComment)}</span></div>` : ""}
      <div class="row mt-16"><a class="btn ghost" href="#/student/assignments">返回作业</a><a class="btn primary" href="#/student/home">回到首页</a></div>
    </div>
    <div class="assignment-card mt-12">
      <div class="assignment-top"><span class="assignment-type write">${ico("pen", "lg")}</span><div class="grow"><div class="title">答题情况</div><div class="sub">共 ${template?.questions.length || 0} 题 · ${graded ? "老师已确认" : "AI 已完成自动评分"}</div></div><span class="chip ${graded ? "green" : "gold"}">${graded ? "已确认" : "待确认"}</span></div>
    </div>
    ${remedial ? studentRemedialCard(remedial) : ""}`;
}

function studentRemedialCard(remedial) {
  const open = remedial.status === "open";
  return `<a class="remedial-card ${open ? "open" : "done"}" href="#/student/remedial/${remedial.id}">
    <span class="remedial-icon">${ico(open ? "target" : "checkCircle", "lg")}</span>
    <span class="task-copy"><strong>${open ? "错题再练" : "再练已完成"}</strong><span>${esc(remedial.reason)}</span></span>
    <span class="remedial-score">${open ? `${remedial.questions.length} 题` : `${remedial.score} 分`}</span>
    ${ico("chevronRight", "sm")}
  </a>`;
}

function studentRead(assignmentId) {
  const assignment = assignmentForStudent(assignmentId, ui.studentId);
  if (!assignment) return emptyState("alert", "找不到这次朗读", "返回朗读页看看。");
  const passage = getPassage(assignment.passageId);
  const existing = submissionFor(assignmentId, ui.studentId);
  if (existing) return studentReadResult(existing, assignment, passage, true);
  ensureStudentFlow(assignmentId);
  if (ui.read.assignmentId !== assignmentId) {
    ui.read = { assignmentId, stage: "intro", seconds: 0, result: null, error: null };
  }
  const stage = ui.read.stage;
  const position = ui.flow.queue.indexOf(assignmentId) + 1;
  return `
    <div class="student-page-head"><a class="icon-btn" href="#/student/home">${ico("arrowLeft", "sm")}</a><div class="grow"><h2>${passage.title}</h2><p>第 ${position || 1} 份 / 共 ${ui.flow.queue.length || 1} 份 · ${passage.words} 词 · ${passage.level}</p></div><span class="chip gold">朗读</span></div>
    <div class="daily-flow-progress"><i style="width:${Math.round(((position - 1) / Math.max(1, ui.flow.queue.length)) * 100)}%"></i></div>
    ${stage === "intro" ? `
      <div class="passage-card">
        <div class="passage-meta"><span class="chip green">${passage.grade}</span><span class="chip gray">${passage.level}</span><span class="chip gray">约 2 分钟</span></div>
        <div class="passage-text">${passage.text.split(" ").map(word => `<span class="w">${esc(word)}</span>`).join(" ")}</div>
        ${passage.audioUrl ? `<audio class="teacher-audio" controls src="${esc(passage.audioUrl)}"></audio><div class="teacher-audio-note">${ico("volume", "sm")} 老师示范录音 · ${esc(passage.audioName || "已上传")}</div>` : ""}
        ${(passage.keyWords || []).length ? `<div class="student-keywords">${passage.keyWords.map(item => `<span><b>${esc(item.word)}</b>${esc(item.note)}</span>`).join("")}</div>` : ""}
        <div class="read-actions">
          <button class="btn ghost grow" data-action="play-model" data-id="${assignment.id}">${ico("volume", "sm")} 听示范</button>
          <button class="btn primary grow" data-action="start-recording">${ico("mic", "sm")} 开始朗读</button>
        </div>
      </div>
      <div class="tip-card mt-12">${ico("lightbulb", "sm")}<span>小提示：先听一遍示范，再跟着读。正式录音前可以随时重来。</span></div>
    ` : ""}
    ${stage === "recording" ? `
      <div class="recording-stage">
        <button class="mic-button recording" data-action="stop-recording">${ico("stop", "xl")}</button>
        <div class="record-timer" id="record-timer">00:00</div>
        <div class="record-hint">正在录音 · 点击方块结束</div>
        ${readingWaveform(true)}
        <div class="row mt-16"><span class="chip coral">录音中</span><span class="tiny muted">原型中使用模拟录音</span></div>
      </div>
      <div class="passage-card mt-12" style="max-height:190px;overflow:auto"><div class="passage-text" style="font-size:13px;line-height:1.8">${esc(passage.text)}</div></div>
    ` : ""}
    ${stage === "scoring" ? `
      <div class="success-card">
        <div class="success-mark" style="background:var(--gold-soft);color:var(--gold)">${ico("sparkles", "xl")}</div>
        <h3>正在分析你的朗读…</h3>
        <p>AI 正在检查发音、流利度、完整度和语调，通常需要 2–3 秒。</p>
        <div class="progress mt-16" style="width:80%"><span style="width:68%;animation:shimmer 1s infinite"></span></div>
      </div>
    ` : ""}
    ${stage === "result" ? studentReadResult({ type: "reading", status: "preview", aiScore: 87, confidence: 93, duration: "0:48", dimensions: { pronunciation: 88, fluency: 84, completeness: 96, prosody: 80 }, errors: ["island", "wooden", "climbed"] }, assignment, passage, false) : ""}`;
}

function studentReadResult(sub, assignment, passage, submitted) {
  const graded = sub.status === "graded";
  const score = sub.status === "preview" ? sub.aiScore : displayScore(sub);
  const showAdvance = submitted && ui.flow.active && ui.flow.lastAward > 0;
  const next = showAdvance ? flowNextTask() : null;
  const remedial = submitted ? remedialForSubmission(sub.id) : null;
  return `
    ${showAdvance ? `<div class="flow-advance-banner"><span>+${ui.flow.lastAward} 积分</span><strong>${next ? `正在打开下一份：${next.title}` : "今天的作业全部完成了"}</strong><a href="${next ? routeForAssignment(next) : "#/student/home"}">立即前往</a></div>` : ""}
    ${!submitted ? `<div class="student-page-head"><a class="icon-btn" href="#/student/reading">${ico("arrowLeft", "sm")}</a><div class="grow"><h2>朗读结果</h2><p>${passage.title}</p></div><span class="chip green">${sub.duration}</span></div>` : `<div class="student-page-head"><a class="icon-btn" href="#/student/reading">${ico("arrowLeft", "sm")}</a><div class="grow"><h2>${passage.title}</h2><p>${graded ? "老师已确认" : "已提交 · 等待老师确认"}</p></div><span class="chip ${graded ? "green" : "gold"}">${graded ? "已批改" : "待确认"}</span></div>`}
    <div class="score-hero">
      <div class="score-ring" style="--p:${score}"><div class="score-ring-content"><b>${score}</b><span>${graded ? "最终得分" : sub.status === "preview" ? "AI 评分" : "AI 初评"}</span></div></div>
      <div class="row mt-12"><span class="chip green">发音 ${sub.dimensions.pronunciation}</span><span class="chip blue">流利 ${sub.dimensions.fluency}</span><span class="chip gold">语调 ${sub.dimensions.prosody}</span></div>
      <div class="tiny muted mt-8">${graded ? "老师已确认本次朗读结果" : "提交后老师可以微调分数与评语"}</div>
    </div>
    <div class="card pad mt-12">
      <div class="section-head"><div><h3 style="margin:0;font-size:12px">四维表现</h3><p>完整度 ${sub.dimensions.completeness} · 整体表现不错</p></div><span class="chip green">超过 78% 的同学</span></div>
      <div class="dimension-list">
        <div class="dimension-row"><span>发音</span><div class="bar"><span style="width:${sub.dimensions.pronunciation}%"></span></div><b>${sub.dimensions.pronunciation}</b></div>
        <div class="dimension-row"><span>流利度</span><div class="bar"><span style="width:${sub.dimensions.fluency}%"></span></div><b>${sub.dimensions.fluency}</b></div>
        <div class="dimension-row"><span>完整度</span><div class="bar"><span style="width:${sub.dimensions.completeness}%"></span></div><b>${sub.dimensions.completeness}</b></div>
        <div class="dimension-row"><span>语调</span><div class="bar"><span style="width:${sub.dimensions.prosody}%"></span></div><b>${sub.dimensions.prosody}</b></div>
      </div>
    </div>
    <div class="card pad mt-12">
      <div class="section-head"><div><h3 style="margin:0;font-size:12px">需要留意的词</h3><p>点击喇叭听标准发音</p></div><span class="chip coral">${(sub.errors || []).length} 个</span></div>
      <div class="recognition-list">
        ${(sub.errors || []).map(word => `<div class="error-word"><span class="word">${word}</span><span class="ipa">/${word === "island" ? "ˈaɪlənd" : word === "wooden" ? "ˈwʊdn" : "klaɪmd"}/</span><button class="icon-btn play" data-action="speak-word" data-word="${word}">${ico("volume", "sm")}</button></div>`).join("")}
      </div>
    </div>
    ${sub.teacherComment ? `<div class="tip-card mt-12">${ico("message", "sm")}<span>${esc(sub.teacherComment)}</span></div>` : ""}
    ${remedial ? studentRemedialCard(remedial) : ""}
    <div class="row mt-16">
      ${sub.status === "preview" ? `<button class="btn ghost grow" data-action="retry-reading">${ico("refresh", "sm")} 再读一次</button><button class="btn primary grow" data-action="submit-reading" data-id="${assignment.id}">${ico("send", "sm")} 提交给老师</button>` : `<a class="btn ghost block" href="#/student/reading">返回朗读列表</a>`}
    </div>`;
}

function studentRemedial(id) {
  const remedial = state.remedials.find(item => item.id === id);
  if (!remedial) return emptyState("alert", "找不到这组练习", "返回今日作业看看。");
  const assignment = getAssignment(remedial.assignmentId);
  const completed = remedial.status === "completed";
  return `
    <div class="student-page-head"><a class="icon-btn" href="#/student/home">${ico("arrowLeft", "sm")}</a><div class="grow"><h2>错题再练</h2><p>${assignment?.title || "针对性练习"} · ${remedial.questions.length} 题</p></div><span class="chip ${completed ? "green" : "coral"}">${completed ? `${remedial.score} 分` : "待完成"}</span></div>
    <div class="remedial-intro"><span class="remedial-icon">${ico("target", "lg")}</span><div><strong>${completed ? "再练完成" : "针对这次的错题，再练一组"}</strong><p>${esc(remedial.reason)}</p></div></div>
    <form data-form="remedial" data-id="${remedial.id}" class="remedial-form">
      ${remedial.questions.map((question, index) => {
        const studentAnswer = remedial.answers?.[index] || "";
        const correct = completed ? isCorrectAnswer(studentAnswer, question.answer) : null;
        return `<div class="remedial-question ${completed ? (correct ? "correct" : "wrong") : ""}">
          <div class="remedial-question-head"><span>${pad2(index + 1)}</span><strong>${esc(question.prompt)}</strong>${completed ? `<span class="chip ${correct ? "green" : "coral"}">${correct ? "正确" : "再看一遍"}</span>` : ""}</div>
          ${question.options ? `<div class="studio-options">${esc(question.options)}</div>` : ""}
          ${completed
            ? `<div class="remedial-answer-line"><span>你的答案：<b>${esc(studentAnswer || "未作答")}</b></span><span>正确答案：<b>${esc(question.answer)}</b></span></div><p class="remedial-explanation">${esc(question.explanation)}</p>`
            : `<label class="studio-field"><span>你的答案</span><input name="q-${index}" value="${esc(studentAnswer)}" placeholder="${question.type === "choice" ? "填写 A / B / C / D" : "填写答案"}"></label>`}
        </div>`;
      }).join("")}
      ${completed
        ? `<div class="remedial-result"><strong>${remedial.score} 分</strong><span>${remedial.score >= 80 ? "掌握得不错，可以回到今日作业。" : "建议再看一遍讲解，明天再练一次。"}</span><a class="focus-primary" href="#/student/home">回到今日</a></div>`
        : `<button class="focus-primary block" type="submit">${ico("check", "sm")} 提交再练</button>`}
    </form>`;
}

function showModal(title, sub, body, size = "") {
  modalRoot.innerHTML = `<div class="modal-backdrop">
    <div class="modal ${size}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="modal-head"><div><h2 class="modal-title">${title}</h2>${sub ? `<p class="modal-sub">${sub}</p>` : ""}</div><button class="modal-close" data-action="close-modal" aria-label="关闭">${ico("x", "sm")}</button></div>
      <div class="modal-body">${body}</div>
    </div>
  </div>`;
  document.body.classList.add("modal-open");
}

function closeModal() {
  modalRoot.innerHTML = "";
  document.body.classList.remove("modal-open");
}

function showStudentFeedback(studentId, assignmentId) {
  const student = getStudent(studentId);
  const assignment = getAssignment(assignmentId);
  if (!student || !assignment) return;
  const sub = submissionFor(assignmentId, studentId);
  const defaultText = (displayScore(sub) || 0) >= 85
    ? "这次完成得很好，表达也比之前自然，继续保持。"
    : "这次有几处需要再留意，明天上课我们一起订正。";
  ui.voice = { studentId, assignmentId, stage: "idle", seconds: 0, text: defaultText, tone: "encourage" };
  renderStudentFeedback();
}

function renderStudentFeedback() {
  const student = getStudent(ui.voice.studentId);
  const assignment = getAssignment(ui.voice.assignmentId);
  if (!student || !assignment) return;
  const sub = submissionFor(assignment.id, student.id);
  const stage = ui.voice.stage;
  const duration = `0:${pad2(Math.max(1, ui.voice.seconds || 0))}`;
  const toneText = ui.voice.tone === "improve" ? "提醒改进" : "鼓励";
  showModal(`${student.name} · 语音评语`, `${assignment.title} · ${displayScore(sub) ?? "—"} 分 · ${sub?.status === "graded" ? "已批改" : "待老师确认"}`, `
    <div class="feedback-person">
      ${avatar(student.name, "lg")}
      <div><strong>${student.name} <span>${student.english}</span></strong><p>${className(student.classId)} · 今天可以收到你的语音</p></div>
    </div>

    <div class="feedback-tone-row">
      <button class="feedback-tone ${ui.voice.tone === "encourage" ? "active" : ""}" data-action="feedback-tone" data-tone="encourage">鼓励</button>
      <button class="feedback-tone ${ui.voice.tone === "improve" ? "active" : ""}" data-action="feedback-tone" data-tone="improve">提醒改进</button>
      <span>${toneText}</span>
    </div>

    <div class="voice-message-recorder ${stage}">
      ${stage === "idle" ? `<button class="voice-record-button" data-action="start-voice-feedback">${ico("mic", "lg")}</button><strong>按住式录音已简化</strong><span>点一下开始，最长 30 秒</span>` : ""}
      ${stage === "recording" ? `<button class="voice-record-button recording" data-action="stop-voice-feedback">${ico("stop", "lg")}</button><strong>正在录音</strong><span id="voice-record-seconds">${duration} · 点一下结束</span><div class="voice-live-wave">${[10,22,14,30,18,36,12,26,16,32,10,20].map((h, i) => `<i style="height:${h}px;animation-delay:${i * 0.06}s"></i>`).join("")}</div>` : ""}
      ${stage === "ready" ? `<div class="voice-ready"><span class="voice-ready-mark">${ico("check", "sm")}</span><strong>语音已录制</strong><span>${duration} · 学生可以反复听</span></div>${readingWaveform(false)}<button class="btn ghost sm" data-action="reset-voice-feedback">重新录</button>` : ""}
    </div>

    <div class="field mt-16"><label>文字备份</label><textarea class="textarea" id="student-feedback-text" placeholder="写一句给学生的反馈">${esc(ui.voice.text)}</textarea></div>
    <div class="feedback-suggestions">
      <button data-action="feedback-template" data-text="读得很棒，注意单词结尾的发音，继续保持。">读得很棒</button>
      <button data-action="feedback-template" data-text="这次书写很认真，再把第三人称单数复习一遍。">提醒复习</button>
      <button data-action="feedback-template" data-text="作业还没有完成，记得今天补交，老师等你。">提醒补交</button>
    </div>
    <div class="feedback-send-row">
      <span>${ico("shield", "sm")} 只有学生和家长可以看到</span>
      <button class="focus-primary" data-action="send-student-feedback">${ico("send", "sm")} 发送给 ${student.name}</button>
    </div>
  `, "");
}

function startVoiceFeedback() {
  ui.voice.stage = "recording";
  ui.voice.seconds = 0;
  renderStudentFeedback();
  const timer = setInterval(() => {
    ui.voice.seconds += 1;
    const target = document.getElementById("voice-record-seconds");
    if (target) target.textContent = `0:${pad2(ui.voice.seconds)} · 点一下结束`;
  }, 1000);
  registerTimer(timer);
}

function stopVoiceFeedback() {
  clearTimers();
  ui.voice.seconds = Math.max(6, ui.voice.seconds || 0);
  ui.voice.stage = "ready";
  renderStudentFeedback();
}

function sendStudentFeedback() {
  const student = getStudent(ui.voice.studentId);
  if (!student) return;
  const textEl = document.getElementById("student-feedback-text");
  const text = (textEl?.value || ui.voice.text || "").trim();
  const hasVoice = ui.voice.stage === "ready";
  if (!text && !hasVoice) {
    toast("先录一段语音，或写一句评语", "error");
    return;
  }
  state.voiceNotes.unshift({
    id: nextId("vn"),
    teacherId: ui.teacherId,
    studentId: student.id,
    assignmentId: ui.voice.assignmentId,
    kind: hasVoice ? "voice" : "text",
    duration: hasVoice ? `0:${pad2(ui.voice.seconds)}` : "",
    tone: ui.voice.tone,
    createdAt: "刚刚",
    text: text || "老师发来了一段语音评语。"
  });
  addAudit(`林知夏老师给 ${student.name} 留下了一条语音评语`);
  saveState();
  closeModal();
  render();
  toast(`${student.name} 会收到这条点评`);
}

function remindStudent(assignmentId, studentId) {
  const assignment = getAssignment(assignmentId);
  const student = getStudent(studentId);
  if (!assignment || !student) return;
  const key = reminderKey(assignmentId, studentId);
  if (state.reminders.some(item => item.key === key)) return;
  state.reminders.unshift({ key, assignmentId, studentId, time: "刚刚" });
  addAudit(`林知夏老师提醒 ${student.name} 补交《${assignment.title}》`);
  saveState();
  render();
  toast(`已提醒 ${student.name} 的家长`);
}

          return `<button class="select-item ${active ? "active" : ""}" data-action="wizard-content" data-id="${item.id}">

            <span class="grow"><b>${item.title}</b><span>${wizard.type === "worksheet" ? `${item.questions.length} 道题 · ${item.grade}` : `${item.words} 词 · ${item.grade}`}</span></span>
            ${active ? ico("checkCircle", "sm") : ""}
          </button>`;
        }).join("")}
      </div>`;
  } else if (step === 2) {
    body = `
      <div class="summary-box mb-16"><b>${contentTitle}</b><br>${wizard.type === "worksheet" ? `${getTemplate(wizard.templateId)?.questions.length} 道题 · 拍照提交` : `${getPassage(wizard.passageId)?.words} 词 · 录音提交`}</div>
      <div class="field"><label>布置到班级组</label><select class="select" id="wizard-class">${state.classes.map(item => `<option value="${item.id}" ${wizard.classId === item.id ? "selected" : ""}>${item.name} · ${item.studentCount} 人 · ${item.grade}</option>`).join("")}</select></div>
      <div class="field"><label>截止时间</label><input class="input" id="wizard-due" value="${esc(wizard.due)}"></div>
      <div class="field"><label>作业标题（可选）</label><input class="input" id="wizard-title" value="${esc(wizard.title)}" placeholder="${esc(contentTitle || "")}"></div>
      <div class="field"><label>给学生的说明</label><textarea class="textarea" placeholder="例如：请独立完成，拍照时注意光线。"></textarea></div>`;
  } else {
    body = `
      <div class="summary-box">
        <div class="between"><span class="muted">作业类型</span><b>${typeLabel(wizard.type)}</b></div>
        <div class="between mt-8"><span class="muted">内容</span><b>${contentTitle}</b></div>
        <div class="between mt-8"><span class="muted">班级</span><b>${classItem?.name} · ${classItem?.studentCount} 人</b></div>
        <div class="between mt-8"><span class="muted">截止</span><b>${wizard.due}</b></div>
      </div>
      <div class="tip-card mt-16">${ico("sparkles", "sm")}<span>发布后学生端会立即出现这份作业；老师端可以从资料库继续复用同一份模板。</span></div>`;
  }
  showModal("布置作业", "三步完成，发布后同步到学生端", `
    <div class="stepper">
      <span class="stepper-item ${step === 1 ? "active" : "done"}"><i>1</i>内容</span><span class="stepper-line"></span>
      <span class="stepper-item ${step === 2 ? "active" : step > 2 ? "done" : ""}"><i>2</i>班级</span><span class="stepper-line"></span>
      <span class="stepper-item ${step === 3 ? "active" : ""}"><i>3</i>发布</span>
    </div>
    ${body}
    <div class="modal-foot" style="padding:18px 0 0">
      ${step > 1 ? `<button class="btn ghost" data-action="wizard-back">上一步</button>` : `<button class="btn ghost" data-action="close-modal">取消</button>`}
      ${step < 3 ? `<button class="btn primary" data-action="wizard-next">下一步 ${ico("arrowRight", "sm")}</button>` : `<button class="btn primary" data-action="wizard-publish">${ico("send", "sm")} 发布到班级</button>`}
    </div>
  `, "wide");
}

function setVerdict(subId, index, value) {
  const sub = getSubmission(subId);
  if (!sub || sub.status === "graded") return;
  sub.review = { ...(sub.review || {}), [index]: value === "true" };
  saveState();
  refreshGradingUI(sub);
}

function refreshGradingUI(sub) {
  const assignment = getAssignment(sub.assignmentId);
  const template = getTemplate(assignment?.templateId);
  if (!template) return;
  const decisions = template.questions.map((question, index) => sub.review?.[index] ?? sub.aiVerdict?.[index] ?? isCorrectAnswer(sub.answers?.[index], question.answer));
  const score = currentWorksheetScore(sub);
  const scoreEl = document.querySelector("[data-score-big]");
  if (scoreEl) scoreEl.innerHTML = `${score}<small>分</small>`;
  document.querySelectorAll("[data-qcard]").forEach(card => {
    const index = Number(card.dataset.qcard);
    card.classList.toggle("is-correct", Boolean(decisions[index]));
    card.classList.toggle("is-wrong", !decisions[index]);
    const chip = card.querySelector(".chip");
    if (chip) {
      chip.className = `chip ${decisions[index] ? "green" : "coral"}`;
      chip.textContent = decisions[index] ? "AI 判对" : "AI 判错";
    }
    card.querySelectorAll(".verdict-btn").forEach(button => {
      const active = (button.dataset.value === "true") === Boolean(decisions[index]);
      button.classList.toggle("active", active);
    });
  });
  document.querySelectorAll(".sheet-q").forEach((el, index) => {
    const mark = el.querySelector(".mark");
    if (mark) {
      mark.className = `mark ${decisions[index] ? "ok" : "no"}`;
      mark.textContent = decisions[index] ? "✓" : "×";
    }
  });
}

function confirmGrade(subId) {
  const sub = getSubmission(subId);
  if (!sub) return;
  const commentEl = document.getElementById("teacher-comment");
  const comment = commentEl ? commentEl.value.trim() : "";
  if (sub.type === "worksheet") {
    sub.score = currentWorksheetScore(sub);
  } else {
    const scoreInput = document.getElementById("reading-score");
    sub.teacherScore = Math.max(0, Math.min(100, Number(scoreInput?.value || sub.aiScore)));
    sub.score = sub.teacherScore;
  }
  sub.status = "graded";
  sub.gradedAt = `今天 ${currentTime()}`;
  sub.teacherComment = comment;
  const student = getStudent(sub.studentId);
  const assignment = getAssignment(sub.assignmentId);
  addAudit(`林知夏老师批改了 ${student?.name} 的《${assignment?.title || "作业"}》`);
  saveState();
  location.hash = "#/teacher/grading";
  render();
  toast("已确认并返回学生");
}

function submitHomework(assignmentId) {
  const assignment = assignmentForStudent(assignmentId, ui.studentId);
  if (!assignment) return;
  if (submissionFor(assignmentId, ui.studentId)) return;
  const template = getTemplate(assignment.templateId);
  const attempt = buildStudentAttempt(template);
  const sub = {
    id: nextId("sub"),
    assignmentId,
    studentId: ui.studentId,
    type: "worksheet",
    status: "ai",
    aiScore: attempt.score,
    confidence: 91,
    submittedAt: `今天 ${currentTime()}`,
    answers: attempt.answers,
    aiVerdict: attempt.verdicts,
    review: {},
    teacherComment: "",
    pointsEarned: taskPoints(assignment)
  };
  state.submissions.push(sub);
  assignment.submitted = Math.min(assignment.total, assignment.submitted + 1);
  recordTaskCompletion(assignment);
  const remedial = createRemedialSet(sub, assignment, template);
  addAudit(`林小满提交了《${assignment.title}》练习册`);
  saveState();
  ui.write.step = 3;
  render();
  scheduleStudentAdvance(1900, assignment.id);
  toast(`AI 评分 ${attempt.score} 分 · +${taskPoints(assignment)} 积分${remedial ? " · 已生成再练" : ""}`);
}

function submitReading(assignmentId) {
  const assignment = assignmentForStudent(assignmentId, ui.studentId);

function passageTitleFor(assignment) {

}

function speakText(text, lang = "en-US") {
  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = lang;
    utterance.rate = 0.86;
    window.speechSynthesis.speak(utterance);
    toast("正在播放发音");
  } else {
    toast("当前浏览器不支持语音播放");
  }
}

function toast(message, type = "success") {
  const element = document.createElement("div");
  element.className = `toast ${type === "error" ? "error" : ""}`;
  element.innerHTML = `<span class="toast-mark">${ico(type === "error" ? "alert" : "check", "sm")}</span><span>${esc(message)}</span>`;
  toastRoot.appendChild(element);
  setTimeout(() => {
    element.style.opacity = "0";
    element.style.transform = "translateY(6px)";
    setTimeout(() => element.remove(), 220);
  }, 2600);
}

function handleForm(form) {
  const type = form.dataset.form;
  const data = Object.fromEntries(new FormData(form));
  if (type === "remedial") {
    const remedial = state.remedials.find(item => item.id === form.dataset.id);
    if (!remedial || remedial.status === "completed") return;
    remedial.answers = remedial.questions.map((question, index) => String(data[`q-${index}`] || "").trim());
    const correct = remedial.questions.filter((question, index) => isCorrectAnswer(remedial.answers[index], question.answer)).length;
    remedial.score = Math.round((correct / Math.max(1, remedial.questions.length)) * 100);
    remedial.status = "completed";
    remedial.completedAt = `今天 ${currentTime()}`;
    addAudit(`${getStudent(remedial.studentId)?.name || "学生"} 完成了错题再练，得分 ${remedial.score}`);
    saveState();
    render();
    toast(`再练完成：${remedial.score} 分`);
    return;
  }
  if (type === "person") {
    const personType = form.dataset.type;
    const id = form.dataset.id;
    if (personType === "teacher") {
      if (id) {
        const teacher = getTeacher(id);
        Object.assign(teacher, { name: data.name, english: data.english, phone: data.phone, status: data.status });
        addAudit(`管理员更新了老师 ${data.name} 的账号信息`);
      } else {
        const teacher = { id: nextId("t"), name: data.name, english: data.english || "Teacher", phone: data.phone || "—", status: data.status || "active", classes: [], joined: "今天" };
        state.teachers.push(teacher);
        addAudit(`管理员添加了老师 ${teacher.name}`);
      }
    } else {
      if (id) {
        const student = getStudent(id);
        const oldClass = student.classId;
        Object.assign(student, { name: data.name, english: data.english, grade: data.grade, classId: data.classId, parent: data.parent });
        if (oldClass !== data.classId) {
          const old = getClass(oldClass);
          const next = getClass(data.classId);
          if (old) old.studentCount = Math.max(0, old.studentCount - 1);
          if (next) next.studentCount += 1;
        }
        addAudit(`管理员更新了学生 ${data.name} 的班级信息`);
      } else {
        const student = { id: nextId("s"), name: data.name, english: data.english || "Student", grade: data.grade, classId: data.classId, parent: data.parent || "—", status: "active", joined: "今天" };
        state.students.push(student);
        state.org.used += 1;
        const classItem = getClass(data.classId);
        if (classItem) classItem.studentCount += 1;
        addAudit(`管理员添加了学生 ${student.name} 到 ${className(data.classId)}`);
      }
    }
    saveState();
    closeModal();
    render();
    toast(id ? "资料已更新" : "添加成功");
  }
  if (type === "class") {
    const classItem = {
      id: nextId("c"), name: data.name, grade: data.grade, teacherId: data.teacherId,
      studentCount: 0, schedule: data.schedule || "待排课", room: data.room || "待分配"
    };
    state.classes.push(classItem);
    addAudit(`管理员创建了班级 ${classItem.name}`);
    saveState();
    closeModal();
    render();
    toast("班级已创建");
  }
  if (type === "content") {
    let refId = "v1";
    if (data.type === "worksheet") {
      const template = clone(tpl1Questions);
      const id = nextId("tpl");
      state.templates.push({ id, title: data.title, book: data.subtitle || "自定义内容", grade: data.grade, page: 1, uses: 0, status: "draft", updated: "刚刚", questions: template });
      refId = id;
    } else if (data.type === "reading") {
      const id = nextId("p");
      state.passages.push({ id, title: data.title, grade: data.grade, level: "待标注", words: 80, text: "This is a demo passage for the content library. Replace it with your own reading material in the real product." });
      refId = id;
    }
    state.library.unshift({ id: nextId("li"), type: data.type, refId, title: data.title, subtitle: `${data.grade} · ${data.subtitle || "新上传"}`, uses: 0, status: "draft", color: data.type === "reading" ? "gold" : data.type === "vocab" ? "green" : "blue" });
    addAudit(`管理员上传了内容《${data.title}》`);
    saveState();
    closeModal();
    render();
    toast("内容已保存为草稿");
  }
  if (type === "template") {
    const template = {
      id: nextId("tpl"), title: data.title, book: data.book || "自定义练习册", grade: data.grade,
      page: Number(data.page) || 1, uses: 0, status: "draft", updated: "刚刚", questions: clone(tpl1Questions)
    };
    state.templates.push(template);
    state.library.unshift({ id: nextId("li"), type: "worksheet", refId: template.id, title: template.title, subtitle: `${template.grade} · ${template.book}`, uses: 0, status: "draft", color: "blue" });
    addAudit(`林知夏老师创建了模板《${template.title}》`);
    saveState();
    ui.selectedTemplateId = template.id;
    ui.selectedQuestion = 0;
    closeModal();
    location.hash = "#/teacher/templates";
    render();
    toast("模板已创建，识别到 10 个答题区");
  }
  if (type === "save-question") {
    const template = getTemplate(form.dataset.id);
    const index = Number(form.dataset.index);
    if (template && template.questions[index]) {
      template.questions[index].type = data.type;
      template.questions[index].answer = data.answer;
      template.questions[index].points = Number(data.points) || 10;
      template.updated = "刚刚";
      saveState();
      render({ keepScroll: true });
      toast("题目已保存");
    }
  }
}

function afterRender() {
  const photoInput = document.getElementById("photo-input");
  if (photoInput) {
    photoInput.addEventListener("change", event => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        ui.write.photo = reader.result;
        ui.write.step = 2;
        ui.write.scanning = true;
        render();
        schedule(() => {
          ui.write.scanning = false;
          render({ keepScroll: true });
          toast("识别完成：10 道题，9 道高置信");
        }, 1600);
      };
      reader.readAsDataURL(file);
    });
  }

  const worksheetUpload = document.getElementById("studio-worksheet-file");
  if (worksheetUpload) {
    worksheetUpload.addEventListener("change", event => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        ui.studio.image = reader.result;
        ui.studio.imageName = file.name;
        if (!ui.studio.title) ui.studio.title = file.name.replace(/\.[^.]+$/, "");
        render({ keepScroll: true });
        toast("练习册照片已上传");
      };
      reader.readAsDataURL(file);
    });
  }

  const audioUpload = document.getElementById("studio-audio-file");
  if (audioUpload) {
    audioUpload.addEventListener("change", event => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        ui.studio.audioUrl = reader.result;
        ui.studio.audioName = file.name;
        render({ keepScroll: true });
        toast("老师录音已上传");
      };
      reader.readAsDataURL(file);
    });
  }
}

function handleWizardNext() {
  const wizard = ui.wizard;
  if (!wizard) return;
  if (wizard.step === 1) {
    wizard.step = 2;
    renderWizard();
    return;
  }
  if (wizard.step === 2) {
    const classSelect = document.getElementById("wizard-class");
    const dueInput = document.getElementById("wizard-due");
    const titleInput = document.getElementById("wizard-title");
    if (classSelect) wizard.classId = classSelect.value;
    if (dueInput) wizard.due = dueInput.value.trim() || "明天 18:00";
    if (titleInput) wizard.title = titleInput.value.trim();
    wizard.step = 3;
    renderWizard();
  }
}

function publishWizard() {
  const wizard = ui.wizard;
  if (!wizard) return;
  const contentTitle = wizard.type === "worksheet" ? getTemplate(wizard.templateId)?.title : getPassage(wizard.passageId)?.title;
  const classItem = getClass(wizard.classId);
  if (!classItem) return;
  const assignment = {
    id: nextId("a"),
    type: wizard.type,
    title: wizard.title || contentTitle || "未命名作业",
    templateId: wizard.type === "worksheet" ? wizard.templateId : undefined,
    passageId: wizard.type === "reading" ? wizard.passageId : undefined,
    classId: wizard.classId,
    teacherId: "t1",
    due: wizard.due,
    dueShort: wizard.due.includes("今天") ? "今天" : wizard.due.includes("明天") ? "明天" : "本周",
    status: "active",
    total: classItem.studentCount,
    submitted: 0,
    createdAt: `今天 ${currentTime()}`
  };
  state.assignments.unshift(assignment);
  const libraryItem = state.library.find(item => item.type === wizard.type && item.refId === (wizard.type === "worksheet" ? wizard.templateId : wizard.passageId));
  if (libraryItem) libraryItem.uses += 1;
  addAudit(`林知夏老师给 ${classItem.name} 布置了《${assignment.title}》`);
  saveState();
  closeModal();
  location.hash = "#/teacher/assignments";
  ui.assignmentsTab = "active";
  render();
  toast("作业已布置到学生端");
}

document.addEventListener("click", event => {
  if (event.target.classList && event.target.classList.contains("modal-backdrop")) {
    closeModal();
    return;
  }
  const el = event.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;

  if (action === "close-modal") {
    closeModal();
    return;
  }
  if (action === "open-studio") {
    location.hash = "#/teacher/create";
    ui.studio.step = 1;
    render();
    return;
  }
  if (action === "studio-type") {
    ui.studio.type = el.dataset.type;
    ui.studio.step = 1;
    ui.studio.draft = null;
    render();
    return;
  }
  if (action === "studio-demo-worksheet") {
    ui.studio.imageName = "Unit 5 Grammar Practice · 演示照片";
    ui.studio.title = ui.studio.title || "Unit 5 Grammar Practice";
    render({ keepScroll: true });
    return;
  }
  if (action === "studio-demo-text") {
    ui.studio.passageText = "The School Garden\n\nOur school has a small garden behind the library. Every Tuesday, the students in Grade Five take care of it. We water the plants, pull out the weeds, and write down what we see. Last month, we planted tomatoes and sunflowers. Our teacher says the garden is a good place to learn patience.";
    ui.studio.title = ui.studio.title || "The School Garden";
    render({ keepScroll: true });
    return;
  }
  if (action === "studio-generate") {
    collectStudioFieldsFromDOM();
    if (ui.studio.type === "worksheet" && !ui.studio.imageName) {
      toast("请先上传练习册照片，或使用演示练习册", "error");
      return;
    }
    if (ui.studio.type === "reading" && !ui.studio.passageText.trim()) {
      toast("请先填写课文内容", "error");
      return;
    }
    ui.studio.generating = true;
    ui.studio.step = 2;
    render();
    schedule(() => {
      if (ui.studio.step === 2 && location.hash === "#/teacher/create") generateStudioDraft();
    }, 1500);
    return;
  }
  if (action === "studio-back") { ui.studio.step = 1; render(); return; }
  if (action === "studio-publish") { publishStudioContent(); return; }
  if (action === "start-task") {
    event.preventDefault();
    startStudentFlow(el.dataset.id);
    return;
  }
  if (action === "view-task") return;
  if (action === "remind-student") { remindStudent(el.dataset.assignment, el.dataset.student); return; }
  if (action === "student-feedback") { showStudentFeedback(el.dataset.student, el.dataset.assignment); return; }
  if (action === "feedback-tone") { ui.voice.tone = el.dataset.tone; renderStudentFeedback(); return; }
  if (action === "start-voice-feedback") { startVoiceFeedback(); return; }
  if (action === "stop-voice-feedback") { stopVoiceFeedback(); return; }
  if (action === "reset-voice-feedback") { ui.voice.stage = "idle"; ui.voice.seconds = 0; renderStudentFeedback(); return; }
  if (action === "feedback-template") {
    const textarea = document.getElementById("student-feedback-text");
    ui.voice.text = el.dataset.text || "";
    if (textarea) textarea.value = ui.voice.text;
    renderStudentFeedback();
    return;
  }
  if (action === "send-student-feedback") { sendStudentFeedback(); return; }
  if (action === "play-feedback") { toast("正在播放 Mia 老师的语音评语（原型模拟）"); return; }
  if (action === "show-guide") { showGuide(); return; }
  if (action === "notifications") { showNotifications(); return; }
  if (action === "student-notifications") { showStudentNotifications(); return; }
  if (action === "reset-demo") { resetDemo(); return; }
  if (action === "people-tab") { ui.peopleTab = el.dataset.tab; render(); return; }
  if (action === "add-person") { showPersonForm(el.dataset.type); return; }
  if (action === "edit-person") { showPersonForm(el.dataset.type, el.dataset.id); return; }
  if (action === "delete-person") { showDeletePerson(el.dataset.type, el.dataset.id); return; }
  if (action === "confirm-delete-person") {
    const type = el.dataset.type;
    const id = el.dataset.id;
    if (type === "teacher") {
      state.teachers = state.teachers.filter(item => item.id !== id);
      state.classes.forEach(item => { if (item.teacherId === id) item.teacherId = ""; });
      addAudit(`管理员移除了老师 ${id}`);
    } else {
      const student = getStudent(id);
      state.students = state.students.filter(item => item.id !== id);
      state.org.used = Math.max(0, state.org.used - 1);
      const classItem = getClass(student?.classId);
      if (classItem) classItem.studentCount = Math.max(0, classItem.studentCount - 1);
      addAudit(`管理员移除了学生 ${student?.name || id}`);
    }
    saveState();
    closeModal();
    render();
    toast("账号已移除");
    return;
  }
  if (action === "toggle-person") {
    const type = el.dataset.type;
    const person = type === "teacher" ? getTeacher(el.dataset.id) : getStudent(el.dataset.id);
    if (person) {
      person.status = person.status === "active" ? "inactive" : "active";
      saveState();
      render();
      toast(person.status === "active" ? "账号已启用" : "账号已停用");
    }
    return;
  }
  if (action === "add-class") { showClassForm(); return; }
  if (action === "view-class") { showClassDetail(el.dataset.id); return; }
  if (action === "library-tab") { ui.libraryTab = el.dataset.tab; render(); return; }
  if (action === "preview-content") { showContentPreview(el.dataset.id); return; }
  if (action === "toggle-content") {
    const item = state.library.find(entry => entry.id === el.dataset.id);
    if (item) {
      item.status = item.status === "published" ? "draft" : "published";
      const ref = item.type === "worksheet" ? getTemplate(item.refId) : null;
      if (ref) ref.status = item.status;
      saveState();
      render();
      toast(item.status === "published" ? "内容已上架" : "内容已下架");
    }
    return;
  }
  if (action === "upload-content") { showContentForm(); return; }
  if (action === "new-assignment") { showAssignmentWizard(); return; }
  if (action === "assignment-detail") { showAssignmentDetail(el.dataset.id); return; }
  if (action === "assignments-tab") { ui.assignmentsTab = el.dataset.tab; render(); return; }
  if (action === "grading-filter") { ui.gradingFilter = el.dataset.filter; render(); return; }
  if (action === "select-template") {
    ui.selectedTemplateId = el.dataset.id;
    ui.selectedQuestion = 0;
    render({ keepScroll: true });
    return;
  }
  if (action === "select-q") {
    ui.selectedQuestion = Number(el.dataset.index);
    render({ keepScroll: true });
    return;
  }
  if (action === "auto-detect") {
    ui.templateScanning = true;
    render({ keepScroll: true });
    schedule(() => {
      ui.templateScanning = false;
      render({ keepScroll: true });
      toast("识别完成：10 道题，10 个答题区");
    }, 1500);
    return;
  }
  if (action === "publish-template") {
    const template = getTemplate(el.dataset.id);
    if (template) {
      template.status = "published";
      const item = state.library.find(entry => entry.type === "worksheet" && entry.refId === template.id);
      if (item) item.status = "published";
      saveState();
      render({ keepScroll: true });
      toast("模板已发布到资料库");
    }
    return;
  }
  if (action === "upload-template") { showTemplateUpload(); return; }
  if (action === "set-verdict") {
    setVerdict(el.dataset.id, Number(el.dataset.index), el.dataset.value);
    return;
  }
  if (action === "accept-all") {
    const sub = getSubmission(el.dataset.id);
    if (!sub) return;
    const assignment = getAssignment(sub.assignmentId);
    const template = getTemplate(assignment?.templateId);
    if (template) {
      sub.review = {};
      template.questions.forEach((question, index) => { sub.review[index] = sub.aiVerdict?.[index] ?? isCorrectAnswer(sub.answers?.[index], question.answer); });
      saveState();
      refreshGradingUI(sub);
      toast("已采纳 AI 的全部判断");
    } else {
      sub.teacherScore = sub.aiScore;
      saveState();
      render({ keepScroll: true });
      toast("已采纳 AI 评分");
    }
    return;
  }
  if (action === "confirm-grade") { confirmGrade(el.dataset.id); return; }
  if (action === "voice-comment") {
    const strip = document.getElementById("voice-strip");
    if (!strip || strip.classList.contains("recording")) return;
    strip.classList.add("recording");
    const title = document.getElementById("voice-title");
    const sub = document.getElementById("voice-sub");
    if (title) title.textContent = "正在录制语音评语…";
    if (sub) sub.textContent = "0:03 · 点击结束（原型模拟）";
    schedule(() => {
      strip.classList.remove("recording");
      if (title) title.textContent = "语音评语已录制（0:03）";
      if (sub) sub.textContent = "会与文字评语一起返回学生";
      const comment = document.getElementById("teacher-comment");
      if (comment) comment.value = `${comment.value}${comment.value ? "\n" : ""}[语音评语 0:03]`;
      toast("语音评语已录制");
    }, 1800);
    return;
  }
  if (action === "play-reading") { toast("正在播放学生录音（原型模拟）"); return; }
  if (action === "speak-word") { speakText(el.dataset.word || "word"); return; }
  if (action === "demo-photo") {
    ui.write.photo = null;
    ui.write.step = 2;
    ui.write.scanning = true;
    render();
    schedule(() => {
      ui.write.scanning = false;
      render({ keepScroll: true });
      toast("识别完成：10 道题，9 道高置信");
    }, 1600);
    return;
  }
  if (action === "reset-write") {
    ui.write = { assignmentId: ui.write.assignmentId, step: 1, photo: null, scanning: false };
    render();
    return;
  }
  if (action === "submit-homework") { submitHomework(el.dataset.id); return; }
  if (action === "start-recording") {
    ui.read.stage = "recording";
    ui.read.seconds = 0;
    render();
    const timer = setInterval(() => {
      ui.read.seconds += 1;
      const elTimer = document.getElementById("record-timer");
      if (elTimer) elTimer.textContent = `${pad2(Math.floor(ui.read.seconds / 60))}:${pad2(ui.read.seconds % 60)}`;
    }, 1000);
    registerTimer(timer);
    return;
  }
  if (action === "stop-recording") {
    clearTimers();
    ui.read.stage = "scoring";
    if (ui.read.seconds < 2) ui.read.seconds = 48;
    render();
    schedule(() => {
      ui.read.stage = "result";
      render();
    }, 1500);
    return;
  }
  if (action === "play-model") {
    const assignment = getAssignment(el.dataset.id || "a2") || getAssignment(ui.read.assignmentId);
    const passage = assignment ? getPassage(assignment.passageId) : getPassage("p1");
    if (passage?.audioUrl) {
      new Audio(passage.audioUrl).play();
      toast("正在播放老师示范录音");
    } else {
      speakText(passage?.text || "A small island.");
    }
    return;
  }
  if (action === "retry-reading") {
    ui.read.stage = "intro";
    ui.read.result = null;
    render();
    return;
  }
  if (action === "submit-reading") { submitReading(el.dataset.id); return; }
  if (action === "wizard-type") {
    ui.wizard.type = el.dataset.type;
    renderWizard();
    return;
  }
  if (action === "wizard-content") {
    if (ui.wizard.type === "worksheet") ui.wizard.templateId = el.dataset.id;
    else ui.wizard.passageId = el.dataset.id;
    renderWizard();
    return;
  }
  if (action === "wizard-next") { handleWizardNext(); return; }
  if (action === "wizard-back") { ui.wizard.step = Math.max(1, ui.wizard.step - 1); renderWizard(); return; }
  if (action === "wizard-publish") { publishWizard(); return; }
  if (action === "use-content") {
    const type = el.dataset.type;
    const ref = el.dataset.ref;
    closeModal();
    ui.wizard = {
      step: 2,
      type,
      templateId: type === "worksheet" ? ref : "tpl1",
      passageId: type === "reading" ? ref : "p1",
      classId: "c1",
      due: "明天 18:00",
      title: ""
    };
    renderWizard();
    return;
  }
});

document.addEventListener("submit", event => {
  const form = event.target.closest("form[data-form]");
  if (!form) return;
  event.preventDefault();
  handleForm(form);
});

document.addEventListener("input", event => {
  if (event.target.matches("[data-search-input]")) {
    const query = event.target.value.trim().toLowerCase();
    document.querySelectorAll("[data-search-row]").forEach(row => {
      row.style.display = (row.dataset.search || "").includes(query) ? "" : "none";
    });
  }
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeModal();
});

window.addEventListener("hashchange", () => {
  closeModal();
  render();
});

/* ============================================================
   Boot
   ============================================================ */
render();





</script>
</body>
</html>
